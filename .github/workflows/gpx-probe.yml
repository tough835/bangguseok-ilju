name: koreatrail-probe
# API 목록에 빠진 코리아둘레길 코스 GPX를 번호 범위로 찾아 data/koreatrail_probe.json 저장
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/gpx_probe.py' ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/gpx_probe.py
      - run: |
          git config user.name "gpx-bot"; git config user.email "gpx-bot@users.noreply.github.com"
          git add data/koreatrail_probe.json
          git commit -m "코리아둘레길 빠진 코스 GPX 찾기 결과" || echo "no change"
          git pull --rebase origin main && git push origin HEAD:main
