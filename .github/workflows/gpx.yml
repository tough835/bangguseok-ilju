name: koreatrail-gpx
# 코리아둘레길 공식 GPX 받기 (두루누비) → data/koreatrail.json 으로 저장해 main에 올림
on:
  workflow_dispatch:
  push:
    paths: [ 'data/koreatrail_urls.json', 'tools/gpx_fetch.py' ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/gpx_fetch.py
      - run: |
          git config user.name "gpx-bot"; git config user.email "gpx-bot@users.noreply.github.com"
          git add data/koreatrail.json
          git commit -m "코리아둘레길 GPX 좌표 갱신" || echo "no change"
          git pull --rebase origin main && git push origin HEAD:main
