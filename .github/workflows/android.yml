# 방구석러너 안드로이드 앱(APK) 자동 빌드
# app/ 아래가 바뀌거나 직접 실행하면 → APK를 만들어 GitHub Release 'apk-latest'에 올림
# 폰에서 받는 주소: https://github.com/tough835/bangguseok-runner/releases/latest/download/bangguseok-runner.apk
name: Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', 'keystore/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 앱 준비 (npm · Capacitor sync)
        working-directory: app
        run: |
          npm ci
          npx cap sync android

      - name: APK 빌드
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/bangguseok-runner.apk"

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: bangguseok-apk-${{ github.run_number }}
          path: bangguseok-runner.apk

      - name: 폰에서 받을 수 있게 Release에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v0.1.${{ github.run_number }}
          name: 방구석러너 앱 v0.1.${{ github.run_number }}
          make_latest: true
          body: |
            폰에서 아래 bangguseok-runner.apk 를 눌러 내려받아 설치하세요.
            커밋: ${{ github.sha }}
          files: bangguseok-runner.apk

      # 플레이스토어(비공개 테스트)에 올릴 파일 = AAB. APK와 같은 열쇠로 서명됨.
      # 실패해도 위의 APK 올리기에는 영향이 없게 맨 뒤에 따로 둠.
      - name: AAB 빌드 (플레이스토어 올리기용)
        id: aab
        continue-on-error: true
        working-directory: app/android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/bangguseok-runner.aab"

      - name: AAB도 같은 Release에 올리기
        if: steps.aab.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v0.1.${{ github.run_number }}
          files: bangguseok-runner.aab
