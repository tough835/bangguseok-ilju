<!DOCTYPE html>
<html lang="ko">

<title>방구석일주</title>
<style>

     아래 WORLD에 도시를 하나 더 넣고 ACTIVE만 바꾸면 됩니다.
   · 도시마다 바뀌는 것 = theme(배경 그림 묶음·색감), 명소 그림·사진,
     코스 경로(path), 화면 글자(TEXT, 나중에 다국어).

    { id: 'jp', name: { ko: '일본' },         children: [ { id: 'tokyo-to', name: { ko: '도쿄도' }, children: [ { id: 'tokyo', name: { ko: '도쿄' } } ] },

    { id: 'hk', name: { ko: '홍콩' },         children: [ { id: 'hk-island', name: { ko: '홍콩섬' }, children: [ { id: 'hongkong', name: { ko: '홍콩' } } ] } ] },

  ],

      id: 'hamyang',

const cum = [0];

let mapBase = null, mapTf = null;
function buildMapBase(){
  const xs = P.map(p=>p.x), ys = P.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sz = mapCv.width, pad = 26*DPR, sc = (sz - 2*pad) / Math.max(maxX-minX, maxY-minY);
  const ox = (sz - (maxX-minX)*sc)/2, oy = (sz - (maxY-minY)*sc)/2;
  mapTf = p => [ox + (p.x-minX)*sc, sz - oy - (p.y-minY)*sc];
  mapBase = document.createElement('canvas'); mapBase.width = mapBase.height = sz;
  const g = mapBase.getContext('2d');
  g.lineJoin = 'round'; g.lineCap = 'round';
  // 구간별 색
  const step = 10;
  for (let d = 0; d < L; d += step){
    const a = mapTf(pointAt(d)), b = mapTf(pointAt(Math.min(d + step, L - 0.5)));   // 끝→출발 직선 안 그림
    g.strokeStyle = ({ lotus:'#e48aa8', valley:'#3f8fc4', village:'#c9a35a', mtn:'#2f6b34', road:'#6c6f73', bank:'#5aa6cf', cherry:'#f0a3bd' })[COURSE.segments[zoneIndexAt(d)].scene] || '#4f9a5c';
    g.lineWidth = 4*DPR; g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
  }
  COURSE.landmarks.forEach(lm => { const q = mapTf(pointAt(lm.at));
    g.fillStyle = '#fff'; g.strokeStyle = '#7a5a2e'; g.lineWidth = 1.5*DPR;
    g.beginPath(); g.arc(q[0], q[1], 3*DPR, 0, 7); g.fill(); g.stroke(); });

}
function drawMap(pos){

    ctx.fillStyle = alt ? st.grass1 : st.grass2;
    ctx.fillRect(0, p2.y, W, p1.y - p2.y + 1);
    const w1 = HALF * p1.s, w2 = HALF * p2.s;
    ctx.fillStyle = alt ? st.road1 : st.road2;
    quad(p1.x - w1, p1.y, p1.x + w1, p1.y, p2.x + w2, p2.y, p2.x - w2, p2.y);
    const e1 = w1 * 0.12, e2 = w2 * 0.12;
    ctx.fillStyle = alt ? st.edge1 : st.edge2;
    quad(p1.x - w1 - e1, p1.y, p1.x - w1, p1.y, p2.x - w2, p2.y, p2.x - w2 - e2, p2.y);
    quad(p1.x + w1, p1.y, p1.x + w1 + e1, p1.y, p2.x + w2 + e2, p2.y, p2.x + w2, p2.y);
    if (st.water > 0.3){   // 오른쪽 계곡물
      const a1 = p1.x + (HALF + 2.2) * p1.s, b1 = p1.x + (HALF + 9) * p1.s, a2 = p2.x + (HALF + 2.2) * p2.s, b2 = p2.x + (HALF + 9) * p2.s;
      ctx.fillStyle = alt ? '#5aa6cf' : '#62afd6'; quad(a1, p1.y, b1, p1.y, b2, p2.y, a2, p2.y);
    }
    if (st.line > 0.5 && a.idx % 4 < 2){   // 도로 중앙선
      ctx.fillStyle = '#e8c547'; quad(p1.x - w1*0.04, p1.y, p1.x + w1*0.04, p1.y, p2.x + w2*0.04, p2.y, p2.x - w2*0.04, p2.y);
    }
  }

  // 나무·연꽃·명소 모으기
  const sprites = [];
  for (let n = 1; n < pts.length; n++){
    const p = pts[n], idx = p.idx, stn = styleAt(idx * SEG);
    for (let k = 0; k < 2; k++){
      const side = k ? 1 : -1, r = rnd(idx * 2 + k);
      const nearLm = COURSE.landmarks.some(lm => lm.side === side && Math.abs(((idx*SEG - lm.at + L/2) % L + L) % L - L/2) < 22);
      if (r < stn.tree * 0.9 && !nearLm){
        const off = side * (HALF + 1.6 + rnd(idx*3+k) * 7);
        sprites.push({ type:'tree', fw: p.fw - off * Math.sin(p.dh), lt: p.lt + off * Math.cos(p.dh), v: rnd(idx*5+k), pink: stn.blossom > 0.5 });
      }
      if (stn.rock && rnd(idx * 17 + k) < stn.rock * 0.5){
        const off = side * (HALF + 0.9 + rnd(idx*19+k) * 3);
        sprites.push({ type:'rock', fw: p.fw - off * Math.sin(p.dh), lt: p.lt + off * Math.cos(p.dh), v: rnd(idx*23+k) });
      }
      if (stn.house && idx % 9 === 0 && rnd(idx * 29 + k) < stn.house && !nearLm){
        const off = side * (HALF + 6 + rnd(idx*31+k) * 6);
        sprites.push({ type:'house', fw: p.fw - off * Math.sin(p.dh), lt: p.lt + off * Math.cos(p.dh), v: rnd(idx*37+k) });
      }
      if (stn.lotus > 0.3 && r < stn.lotus){
        for (let j = 0; j < 2; j++){
          const off = side * (HALF + 0.8 + rnd(idx*7+k*3+j) * 6);
          sprites.push({ type:'lotus', fw: p.fw - off * Math.sin(p.dh), lt: p.lt + off * Math.cos(p.dh), v: rnd(idx*11+j+k) });
        }
      }
    }
  }
  COURSE.landmarks.forEach(lm => {
    const da = ((lm.at - pos) % L + L) % L;
    const u = (da + frac) / SEG, n = Math.floor(u);
    if (n < 1 || n >= pts.length - 1) return;
    const a = pts[n], b = pts[n+1], t = u - n;
    const fwd = a.fw + (b.fw - a.fw)*t, lat = a.lt + (b.lt - a.lt)*t, off = lm.side * (HALF + 5);
    sprites.push({ type:'lm', lm, da, fw: fwd - off*Math.sin(a.dh), lt: lat + off*Math.cos(a.dh) });
  });
  sprites.sort((a, b) => b.fw - a.fw);
  labels = [];
  for (const sp of sprites){
    if (sp.fw < (sp.type === 'tree' ? 3.5 : 1.2)) continue;
    const p = proj(sp.fw, sp.lt);
    if (p.x < -W*0.6 || p.x > W*1.6) continue;
    if (sp.type === 'tree') drawTree(p.x, p.y, p.s, sp.v, sp.fw, sp.pink);
    else if (sp.type === 'lotus') drawLotus(p.x, p.y, p.s, sp.v);
    else if (sp.type === 'rock' && img('rock_1')){ const w = (0.7 + sp.v) * p.s; if (w > 2) drawSprite(img('rock_1'), p.x, p.y, w); }
    else if (sp.type === 'rock'){ const r = (0.35 + sp.v * 0.5) * p.s; if (r > 1){ ctx.fillStyle = sp.v > 0.5 ? '#8d8a80' : '#a19d92'; ctx.beginPath(); ctx.ellipse(p.x, p.y - r*0.5, r, r*0.6, 0, 0, 7); ctx.fill(); } }
    else if (sp.type === 'house') drawHouse(p.x, p.y, p.s, sp.v);
    else drawLandmark(sp.lm, p.x, p.y, p.s, sp.da);
  }
  labels.forEach(drawLabel);
}
function quad(x1,y1,x2,y2,x3,y3,x4,y4){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4); ctx.closePath(); ctx.fill(); }
function fog(c, fw){ return fw > 300 ? 0.55 : fw > 150 ? 0.8 : 1; }

const PINK = { A: ['#f2a9c2','#f8cbda'], B: ['#ee9ab8','#f5bdd0'] };
function drawTree(x, y, s, v, fw, pink){
  const h = (7 + v*5) * s, tw = 0.35 * s;
  if (h < 2) return;
  ctx.globalAlpha = fog(null, fw);
  const tim = pink ? img('tree_pink') : (v < 0.33 ? img('tree_pine') : v < 0.66 ? img('tree_green_1') : img('tree_green_2')) || img('tree_green_1');
  if (tim){ const w = h * tim.width / tim.height; ctx.drawImage(tim, x - w/2, y - h, w, h); ctx.globalAlpha = 1; return; }
  ctx.fillStyle = TREES.trunk; ctx.fillRect(x - tw/2, y - h*0.45, tw, h*0.45);
  const r = h * 0.3;
  const lA = pink ? PINK.A : TREES.leafA, lB = pink ? PINK.B : TREES.leafB;
  ctx.fillStyle = v > 0.5 ? lA[0] : lB[0];
  ctx.beginPath(); ctx.arc(x, y - h*0.62, r, 0, 7); ctx.fill();
  ctx.fillStyle = v > 0.5 ? lA[1] : lB[1];
  ctx.beginPath(); ctx.arc(x - r*0.35, y - h*0.72, r*0.7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r*0.4, y - h*0.55, r*0.6, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawHouse(x, y, s, v){   // 시골집 (흰 벽 + 기와 지붕)
  const w = 6 * s, h = 2.6 * s; if (w < 3) return;
  if (img('house_1')){ drawSprite(img('house_1'), x, y, w); return; }
  ctx.fillStyle = '#efe9dc'; ctx.fillRect(x - w/2, y - h, w, h);
  ctx.fillStyle = '#7a5a3a'; ctx.fillRect(x - w*0.1, y - h*0.7, w*0.2, h*0.7);
  ctx.fillStyle = v > 0.5 ? '#4a5560' : '#6b4a3a';
  ctx.beginPath(); ctx.moveTo(x - w*0.62, y - h); ctx.quadraticCurveTo(x - w*0.3, y - h*1.25, x - w*0.35, y - h*1.6);
  ctx.lineTo(x + w*0.35, y - h*1.6); ctx.quadraticCurveTo(x + w*0.3, y - h*1.25, x + w*0.62, y - h); ctx.closePath(); ctx.fill();
}
function drawLotus(x, y, s, v){
  const r = 0.45 * s; if (r < 0.8) return;
  if (img('lotus')){ drawSprite(img('lotus'), x, y, r * 3); return; }
  ctx.fillStyle = '#4e8f3e'; ctx.beginPath(); ctx.ellipse(x, y, r*1.3, r*0.5, 0, 0, 7); ctx.fill();
  if (v > 0.35){ ctx.fillStyle = v > 0.7 ? '#f3a6c0' : '#f7c4d5';
    ctx.beginPath(); ctx.arc(x, y - r*0.6, r*0.5, 0, 7); ctx.fill(); }
}

function drawLandmark(lm, x, y, s, da){
  const u = s;   // 1m당 화면 크기
  const lim = img('lm_' + lm.art);
  if (lim){ drawSprite(lim, x, y, (LM_W[lm.art] || 4) * u); if (da < 160) labels.push({ lm, x, y, u, da }); return; }
  ctx.save(); ctx.translate(x, y);
  const roof = '#3e4a4c', pillar = '#a8402f', wood = '#7d5a3a', stone = '#9a9a92';
  switch (lm.art){
    case 'gate': case 'pavilion': {
      const w = (lm.art === 'gate' ? 9 : 6) * u, h = (lm.art === 'gate' ? 7 : 4.5) * u;
      ctx.fillStyle = '#cfc6b0'; ctx.fillRect(-w/2 - 0.4*u, -0.8*u, w + 0.8*u, 0.8*u);
      ctx.fillStyle = pillar;
      for (let i = 0; i < 4; i++) ctx.fillRect(-w/2 + i*(w - 0.4*u)/3, -h, 0.4*u, h - 0.8*u);
      if (lm.art === 'gate'){ ctx.fillStyle = wood; ctx.fillRect(-w/2, -h*0.6, w, 0.5*u); }
      ctx.fillStyle = roof; ctx.beginPath();
      ctx.moveTo(-w/2 - 1.6*u, -h + 0.2*u);
      ctx.quadraticCurveTo(-w/4, -h - 0.6*u, -w*0.3, -h - 2.2*u);
      ctx.lineTo(w*0.3, -h - 2.2*u);
      ctx.quadraticCurveTo(w/4, -h - 0.6*u, w/2 + 1.6*u, -h + 0.2*u);
      ctx.closePath(); ctx.fill();
      break; }
    case 'stele': {
      ctx.fillStyle = '#7f7f78'; ctx.beginPath(); ctx.ellipse(0, -0.5*u, 1.4*u, 0.6*u, 0, 0, 7); ctx.fill();
      ctx.fillStyle = stone; ctx.fillRect(-0.6*u, -3.6*u, 1.2*u, 3.1*u);
      ctx.fillStyle = '#6d6d66'; ctx.fillRect(-0.8*u, -4.2*u, 1.6*u, 0.6*u);
      break; }
    case 'buddha': {
      ctx.fillStyle = '#8c8a80'; ctx.fillRect(-1*u, -0.6*u, 2*u, 0.6*u);
      ctx.fillStyle = stone; ctx.beginPath(); ctx.ellipse(0, -1.6*u, 0.8*u, 1.1*u, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -3*u, 0.45*u, 0, 7); ctx.fill();
      break; }
    case 'mill': {
      ctx.fillStyle = '#c9b48d'; ctx.fillRect(0.4*u, -2.6*u, 3*u, 2.6*u);
      ctx.fillStyle = '#6a5a4a'; ctx.beginPath(); ctx.moveTo(0, -2.6*u); ctx.lineTo(1.9*u, -3.8*u); ctx.lineTo(3.8*u, -2.6*u); ctx.fill();
      ctx.strokeStyle = wood; ctx.lineWidth = Math.max(1, 0.25*u);
      ctx.beginPath(); ctx.arc(-0.8*u, -1.6*u, 1.6*u, 0, 7); ctx.stroke();
      for (let i = 0; i < 4; i++){ const a = i * Math.PI/4 + performance.now()/900;
        ctx.beginPath(); ctx.moveTo(-0.8*u - Math.cos(a)*1.6*u, -1.6*u - Math.sin(a)*1.6*u);
        ctx.lineTo(-0.8*u + Math.cos(a)*1.6*u, -1.6*u + Math.sin(a)*1.6*u); ctx.stroke(); }
      break; }
    case 'bridge': {
      ctx.fillStyle = '#6fa6c4'; ctx.fillRect(-4*u, -0.3*u, 8*u, 0.3*u);
      ctx.strokeStyle = '#8d7a5e'; ctx.lineWidth = Math.max(1, 0.5*u);
      ctx.beginPath(); ctx.moveTo(-4*u, 0); ctx.quadraticCurveTo(0, -2.4*u, 4*u, 0); ctx.stroke();
      ctx.lineWidth = Math.max(1, 0.15*u);
      ctx.beginPath(); ctx.moveTo(-3.6*u, -0.9*u); ctx.quadraticCurveTo(0, -3.1*u, 3.6*u, -0.9*u); ctx.stroke();
      break; }
    case 'village': {
      ctx.fillStyle = '#efe9dc'; ctx.fillRect(-3*u, -2.6*u, 6*u, 2.6*u);
      ctx.fillStyle = '#4a5560'; ctx.beginPath(); ctx.moveTo(-3.8*u, -2.6*u); ctx.lineTo(-2*u, -4.2*u); ctx.lineTo(2*u, -4.2*u); ctx.lineTo(3.8*u, -2.6*u); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7a5a3a'; ctx.fillRect(-0.5*u, -1.8*u, 1*u, 1.8*u);
      ctx.fillStyle = '#5b4632'; ctx.fillRect(4.2*u, -2.4*u, 0.2*u, 2.4*u); ctx.fillStyle = '#f4ead2'; ctx.fillRect(3.6*u, -3.2*u, 1.6*u, 0.9*u);
      break; }
    case 'falls': {
      ctx.fillStyle = '#8d8a80'; ctx.beginPath(); ctx.moveTo(-4*u, 0); ctx.lineTo(-3*u, -6*u); ctx.lineTo(3*u, -6.5*u); ctx.lineTo(4*u, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d9eef8'; ctx.fillRect(-0.9*u, -6.2*u, 1.8*u, 6.2*u);
      ctx.fillStyle = '#6fb2d8'; ctx.beginPath(); ctx.ellipse(0, -0.1*u, 3*u, 0.6*u, 0, 0, 7); ctx.fill();
      break; }
    default: {
      ctx.fillStyle = wood; ctx.fillRect(-0.12*u, -2.2*u, 0.24*u, 2.2*u);
      ctx.fillStyle = '#f4ead2'; ctx.fillRect(-1.3*u, -3.2*u, 2.6*u, 1.2*u);
      ctx.fillStyle = '#e48aa8'; ctx.beginPath(); ctx.arc(0, -2.6*u, 0.35*u, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
  // 이름표: 가까워지면 표시 (나무에 가리지 않게 맨 마지막에 그림)
  if (da < 160) labels.push({ lm, x, y, u, da });
}
function drawLabel({ lm, x, y, u, da }){
  {
    const a = Math.min(1, (160 - da) / 50), fs = Math.round(15 * DPR);
    ctx.globalAlpha = a; ctx.font = '700 ' + fs + 'px sans-serif';
    const tw = ctx.measureText(tr(lm.name)).width, ty = y - 9*u - 14*DPR;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(x - tw/2 - 9*DPR, ty - fs, tw + 18*DPR, fs + 10*DPR, 9*DPR);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(tr(lm.name), x, ty + 1*DPR); ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}
function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); ctx.fill(); }

const $ = id => document.getElementById(id);
function effSpeed(){ return S.speed * (S.machine === 'bike' ? BIKE_FACTOR : 1); }   // km/h
function totalNow(){ return S.startTotal + S.sessionM; }
function fmtKm(m){ return (m/1000).toFixed(2) + ' km'; }
function fmtTime(sec){ sec = Math.floor(sec); const h = Math.floor(sec/3600), m = Math.floor(sec/60)%60, s = sec%60;
  return (h ? h + ':' : '') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }

let popupQueue = [], popupTimer = null;
function showPopup(title, desc, photo){
  popupQueue.push({ title, desc, photo });
  if (!popupTimer) nextPopup();
}
function nextPopup(){
  const p = popupQueue.shift();
  if (!p){ $('popup').classList.add('hidden'); popupTimer = null; return; }
  $('pTitle').textContent = p.title; $('pDesc').textContent = p.desc || '';
  const hasPh = typeof p.photo === 'string';   // 사진이 없으면 빈 '사진 자리' 칸을 띄우지 않음 (11/15 보스)
  $('pPhoto').classList.toggle('hidden', !hasPh); $('pPhoto').innerHTML = hasPh ? photoHtml(p.photo, 10) : '';
  $('popup').classList.remove('hidden');
  popupTimer = setTimeout(nextPopup, 5500);
}
$('popup').onclick = () => { clearTimeout(popupTimer); nextPopup(); };

function advance(dm){
  const before = totalNow();
  S.sessionM += dm;
  const after = totalNow();
  // 명소 통과
  COURSE.landmarks.forEach(lm => {
    const k = Math.floor((after - lm.at) / L);
    const hit = k * L + lm.at;
    if (hit > before && hit <= after){ S.passed.push(tr(lm.name)); showPopup('📍 ' + tr(lm.name), tr(lm.desc), lm.photo || true); }
  });
  // 완주
  if (Math.floor(after / L) > Math.floor(before / L))
    showPopup(T.done.replace('{course}', tr(COURSE.name)), T.doneN.replace('{n}', Math.floor(after / L)), false);
}

   · 기록 한 건 = { 언제, 운동 종류, 들어온 방법(src: live 실시간 / manual 손입력 / 나중에 gps),

  'start': 'https://commons.wikimedia.org/wiki/File:Hamyang_Sangrim.JPG'
};
const PHOTO_CREDIT = {}, PHOTO_LINK = {};   // 사진 주소 → 출처·원본 (화면에서 찾아 쓰기)
Object.keys(HUB_PHOTO).forEach(k => { if (HUB_CREDIT[k]) PHOTO_CREDIT[HUB_PHOTO[k]] = HUB_CREDIT[k]; if (HUB_LINK[k]) PHOTO_LINK[HUB_PHOTO[k]] = HUB_LINK[k]; });
function photoHtml(src, r, small){
  const cr = PHOTO_CREDIT[src];
  return '<div style="position:relative;width:100%;height:100%"><img src="' + src + '" style="width:100%;height:100%;object-fit:cover;border-radius:' + (r || 0) + 'px">' +
    (cr ? '<span class="pcr"' + (PHOTO_LINK[src] ? ' onclick="event.stopPropagation();window.open(\'' + PHOTO_LINK[src] + '\',\'_blank\')"' : '') + '>' + (small ? '©' : '© ' + cr) + '</span>' : '') + '</div>';
}
Object.values(ALL_ROADS).forEach(c => (c.landmarks || []).forEach(lm => { if (!lm.photo && HUB_PHOTO[lm.id]) lm.photo = HUB_PHOTO[lm.id]; }));
TARGETS.forEach(t => { if (!t.photo && HUB_PHOTO['mtn_' + t.id]) t.photo = HUB_PHOTO['mtn_' + t.id]; });
const MOUNTAINS = TARGETS.filter(t => t.kind === 'mountain').sort((a, b) => a.gain - b.gain);
const TOWERS = TARGETS.filter(t => t.kind === 'tower').sort((a, b) => a.gain - b.gain);
const TGT = id => TARGETS.find(t => t.id === id) || MOUNTAINS[MOUNTAINS.length - 1];
const roadName = id => { const c = ALL_ROADS[id]; return c ? tr(c.short || c.name) : ''; };

/* ---- 저장 ---- */
const STORE_KEY2 = 'bgsj_v2';
let DB = { records: [], climb: { sel: 'cheonwang' }, region: { country: 'kr', prov: 'gyeongnam', city: 'hamyang' },
           pick: { type: 'road', id: COURSE.id }, tab: 'road', act: 'tread', roadAct: 'tread', mode: 'live' };
try {
  const s = JSON.parse(localStorage.getItem(STORE_KEY2));
  if (s && s.records) DB = Object.assign(DB, s);
  else {   // 이전 형식(v1) 옮기기: 누적값을 '이전 기록' 한 건으로
    const o = JSON.parse(localStorage.getItem(STORE_KEY));
    const w = o && o.courses && o.courses['hamyang/sangnim-3k'];
    if (w && w.totalM > 0) DB.records.push({ id: 1, date: new Date().toISOString(), act: 'tread', src: 'legacy', sec: 0, distM: w.totalM, upM: 0, credit: { course: 'sangnim', m: w.totalM }, passed: [] });
    const c = o && o.courses && o.courses.climb;
    if (c && c.prog) Object.keys(c.prog).forEach((id, i) => { const m = (c.prog[id] || 0) + ((c.done && c.done[id]) || 0) * TGT(id).gain;
      if (m > 0) DB.records.push({ id: 2 + i, date: new Date().toISOString(), act: 'stair', src: 'legacy', sec: 0, distM: 0, upM: m, credit: { course: 'climb', target: id, m }, passed: [] }); });
    if (c && c.sel) DB.climb.sel = c.sel;
  }
} catch(e){}
if (!DB.pick || !DB.pick.type) DB.pick = { type: 'road', id: COURSE.id };
if (DB.pick.type === 'road') DB.pick.id = COURSE.id;            // 길 코스는 화면을 불러올 때 정해짐
else DB.climb.sel = TGT(DB.pick.id).id;
if (!ACTS[DB.act]) DB.act = 'tread';
function saveDB(){ try { localStorage.setItem(STORE_KEY2, JSON.stringify(DB)); } catch(e){} }
const creditOf = (r, c) => r.credit && ((r.credit.course === 'walk' && r.credit.target === c.id) || (r.credit.course === 'sangnim' && c.id === 'sangnim-3k')) ? r.credit.m : 0;
const courseTotal = c => DB.records.reduce((a, r) => a + creditOf(r, c), 0);
if (!DB.base) DB.base = {};   // '처음부터'를 누른 지점 (코스별). 기록은 그대로 두고 진행 위치만 0으로
const posTotal = c => Math.max(0, courseTotal(c) - (DB.base[c.id] || 0));
const walkTotal = () => posTotal(COURSE);
const climbTotal = id => Math.max(0, DB.records.reduce((a, r) => a + (r.credit && r.credit.course === 'climb' && r.credit.target === id ? r.credit.m : 0), 0) - ((DB.base || {})['c:' + id] || 0));
const realOf = id => { const r = DB.records.find(x => x.real === id); return r ? new Date(r.date).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }) : null; };
function upsertRecord(r){ upsertRecordRaw(r); try { refreshSteps(); } catch(e){} }
function upsertRecordRaw(rec){ const i = DB.records.findIndex(r => r.id === rec.id); if (i >= 0) DB.records[i] = rec; else DB.records.unshift(rec); saveDB(); }

/* ---- 지금 상태 ---- */
S.act = DB.act; S.level = 8; S.spd = { tread: 6, bike: 20 };
const isClimb = () => ACTS[S.act].kind === 'up';
const isManual = () => false;   // 시작 화면은 '출발'만. 직접 입력은 내 기록에서
function totalNow(){ return S.startTotal + S.sessionM; }
function climbState(){
  const m = TGT(DB.climb.sel);
  const total = S.running && isClimb() ? S.startTotal + S.sessionM : climbTotal(m.id);
  const climbed = total % m.gain;
  return { m, k: (m.kind === 'tower' ? TOWERS : MOUNTAINS).indexOf(m), climbed, elev: m.base + climbed, remain: m.gain - climbed, ratio: climbed / m.gain,
           done: Math.floor(total / m.gain), floor: m.floors ? Math.max(1, Math.round(climbed / m.gain * m.floors)) : 0 };
}
const wpAt = (m, w) => w.at != null ? w.at * m.gain : (w.elev - m.base);   // 이정표가 오른 높이 몇 m 지점인지
const climbMpm = () => levelToSpm(S.level) * STEP_M;
function effSpeed(){ return S.speed; }

/* ---- 거점과 지나는 명소 ----
   거점(hub) = km 단위로 떨어진 주요 명소: 목표가 되고, 도착하면 알림이 뜸
   지나는 명소 = 알림 없이 스티커만 남음 (거점에 도착했을 때 '지나온 곳'으로 한꺼번에 보여 줌) */
const LMS = COURSE.landmarks.slice().sort((a, b) => a.at - b.at);
const HUBS = LMS.some(l => l.hub) ? LMS.filter(l => l.hub) : LMS;
const isHub = lm => HUBS.includes(lm);
const stickersBefore = hub => { const i = HUBS.indexOf(hub), from = i > 0 ? HUBS[i-1].at : -1; return LMS.filter(l => !isHub(l) && l.at > from && l.at < hub.at); };

/* ---- 지나간 곳 찾기 (실시간·손입력 공용) ---- */
function walkPassed(before, after){
  const out = [];
  LMS.forEach(lm => { const k = Math.floor((after - lm.at) / L), hit = k * L + lm.at;
    if (hit > before && hit <= after) out.push({ lm, hit, name: tr(lm.name), desc: tr(lm.desc), photo: lm.photo || true, hub: isHub(lm) }); });
  out.sort((a, b) => a.hit - b.hit);
  const laps = Math.floor(after / L) - Math.floor(before / L);
  if (laps > 0) out.push({ name: T.done.replace('{course}', tr(COURSE.short || COURSE.name)), desc: T.doneN.replace('{n}', Math.floor(after / L)), lap: true });
  return out;
}
function climbPassed(m, before, after){
  const out = [];
  for (let k = Math.floor(before / m.gain); k <= Math.floor(after / m.gain); k++){
    (m.waypoints || []).forEach(w => { const at = k * m.gain + wpAt(m, w); if (at > before && at <= after) out.push({ name: tr(w.name), desc: T.elevAt.replace('{e}', w.elev.toLocaleString()) }); });
    const top = (k + 1) * m.gain;
    if (top > before && top <= after) out.push({ name: tr(m.name) + ' ' + T.summit, short: tr(m.name), photo: m.photo || true,
      desc: (m.kind === 'tower' ? m.floors + T.floorUnit + ' · ' + m.summit + 'm' : T.elevAt.replace('{e}', m.summit.toLocaleString())) + ' · ' + tr(m.desc || m.trail) });
  }
  return out;
}
function advance(dm){
  if (S.free){ freeAdvance(dm); return; }
  const before = totalNow(); S.sessionM += dm;
  walkPassed(before, totalNow()).forEach(p => {
    if (p.lap){ showPopup(p.name, p.desc, false); return; }
    S.passed.push(p.name);
    if (!p.hub) return;                                  // 지나는 명소: 알림 없음
    const st = stickersBefore(p.lm).map(l => tr(l.name));
    const goalHit = S.running && !S.goalDist && S.goalName === p.name && totalNow() >= S.goalAt;
    showPopup((goalHit ? '🎯 ' : '🚩 ') + p.name + ' ' + T.arrive,
      (p.lm.at / 1000).toFixed(1) + 'km · ' + p.desc + (st.length ? '\n🔖 ' + T.passedBy + ': ' + st.join(' · ') : ''), p.photo);
  });
  if (S.running && S.goalAt != null) checkGoal();
}
function advanceClimb(dm){
  if (S.free){ freeAdvance(dm); return; }
  const m = TGT(DB.climb.sel), before = S.startTotal + S.sessionM; S.sessionM += dm;
  climbPassed(m, before, S.startTotal + S.sessionM).forEach(p => { S.passed.push(p.short || p.name); showPopup((p.photo ? (m.kind === 'tower' ? '🏙 ' : '⛰ ') : '🥾 ') + p.name, p.desc, p.photo); });
}

/* ---- 운동 기록 저장 (실시간) ---- */
function sessionRecord(){
  const up = isClimb();
  return { id: S.sessionId, date: new Date(S.sessionId).toISOString(), act: S.act, src: S.gps ? 'gps' : 'live', sec: Math.round(S.elapsed),
    distM: up ? 0 : Math.round(S.sessionM), upM: up ? Math.round(S.sessionM) : 0,
    credit: S.free ? freeCredit() : up ? { course: 'climb', target: DB.climb.sel, m: S.sessionM } : { course: 'walk', target: COURSE.id, m: S.sessionM },
    free: S.free ? { goal: S.freeGoal, unit: up ? 'floor' : 'km' } : undefined,
    passed: S.passed.slice(), site: S.free ? undefined : (siteOK(sitePlace().key) || undefined) };
}
function autosave(final){
  if (S.sessionM >= 1) upsertRecord(sessionRecord());
  else if (final){ DB.records = DB.records.filter(r => r.id !== S.sessionId); saveDB(); }   // 움직인 게 없으면 빈 기록을 남기지 않음
}

/* ===================== 반복 (30fps 상한) ===================== */
let lastFrame = 0, raf = 0, hudTick = 0;
function loop(now){
  raf = requestAnimationFrame(loop);
  if (now - lastFrame < 31) return;
  const wallNow = Date.now(), dt = Math.min((wallNow - S.lastT) / 1000, 6 * 3600); S.lastT = wallNow; lastFrame = now;
  if (S.free){   // 일반: 목표 링 화면
    if (!S.paused){ S.elapsed += dt; if (isClimb()){ if (!autoActive()) advanceClimb(climbMpm() / 60 * dt); } else if (!autoActive() && !S.gps) advance(effSpeed() / 3.6 * dt); }
    if (++hudTick % 6 === 0) hudFree();
    drawFree();
  } else if (isClimb()){
    if (!S.paused){ S.elapsed += dt; if (!autoActive()) advanceClimb(climbMpm() / 60 * dt); S.phase += dt * (autoActive() ? cadence() : levelToSpm(S.level)) / 60 * Math.PI; }
    const amp = S.paused ? 0 : 0.045, bob = Math.abs(Math.sin(S.phase)) * amp - amp/2, sway = Math.sin(S.phase / 2) * amp * 0.6;
    const st = climbState();
    if (++hudTick % 6 === 0){ AREA = viewArea(); hudClimb(st); if (NAV.full) updateInfoClimb(st); }
    if (!AREA) AREA = viewArea();
    if (NAV.full){ drawClimbView(st); drawClimbNav(mctx, 0, 0, mapCv.width, mapCv.height, st, true); miniTag(T.tagHere); }
    else { drawClimbNav(ctx, 0, 0, W, AREA.bot, st, false); drawClimbMini(st); }
  } else {
    const sp = effSpeed();
    if (!S.paused){ S.elapsed += dt; if (!autoActive() && !S.gps) advance(sp / 3.6 * dt); S.phase += dt * (sp >= WALK_RUN_LIMIT ? 2.7 : 1.8) * Math.PI; }
    const run = sp >= WALK_RUN_LIMIT, amp = S.paused || sp <= 0 || S.act === 'bike' ? 0 : (run ? 0.065 : 0.028);
    const bob = Math.abs(Math.sin(S.phase)) * amp - amp/2, sway = Math.sin(S.phase / 2) * amp * 0.8;
    const pos = ((totalNow() % L) + L) % L;
    if (++hudTick % 6 === 0){ AREA = viewArea(); hudWalk(pos); if (NAV.full) updateInfoPanel(pos); }
    if (!AREA) AREA = viewArea();
    const far = S.act === 'bike';
    if (NAV.full){ drawMapView(pos); drawNav(mctx, mapCv.width, mapCv.height, mapCv.width / 2, mapCv.height * 0.62, far ? 420 : 160, pos, true); miniTag(T.tagHere); }
    else { drawNav(ctx, W, AREA.bot, W / 2, AREA.bot * 0.66, far ? 600 : 220, pos, false); drawMiniOverview(pos); }
  }
  if (wallNow - S.lastSave > 15000){ S.lastSave = wallNow; autosave(false); }
}

/* ---- 운동 중 글자 ---- */
const fmtM = m => m >= 1000 ? (m/1000).toFixed(2) + ' km' : Math.round(m) + ' m';
function hudWalk(pos){
  if (S.gps && S.speed > 0 && Date.now() - (GPS.lastMove || 0) > 8000){ S.speed = 0; GPS.spd = 0; refreshSpeedBox(false); }   // 멈춰 서 있으면 0
  if (autoActive()) autoSpeedTick();
  const sp = effSpeed(), nh = nextSpotFrom(totalNow()), gl = Math.max(0, S.goalAt - totalNow());
  $('namePill').textContent = tr(COURSE.short || COURSE.name) + ' · ' + gradeText(pos) + ' · ' + T.alti + ' ' + Math.round(elevAt(pos)) + 'm';
  const other = S.goalDist || tr(nh.lm.name) !== S.goalName;     // 목표가 '다음 거점'이 아닐 때는 다음 거점도 작게 보여 줌
  $('sNextLabel').textContent = S.goalDist ? T.toGoal + ' ' + S.goalName : '🚩 ' + S.goalName;
  $('sNextDist').textContent = fmtM(gl);
  $('sNextName').textContent = other ? '🚩 ' + tr(nh.lm.name) + ' ' + (nh.d >= 1000 ? (nh.d/1000).toFixed(1) + 'km' : Math.round(nh.d) + 'm')
    : (sp > 0 ? T.approx + ' ' + Math.max(1, Math.round(gl / (sp/3.6) / 60)) + T.min : '');
  $('sTodayLabel').textContent = T.today;
  $('sToday').textContent = (S.sessionM / 1000).toFixed(2) + ' km';
  $('sTime').textContent = fmtTime(S.elapsed) + ' · ' + (autoActive() ? T.stepsN.replace('{n}', SENS.sessSteps) : S.act === 'bike' ? T.aBike : (sp >= WALK_RUN_LIMIT ? T.run : T.walk));
  $('progBar').style.width = (pos / L * 100).toFixed(1) + '%';   // 코스 전체 진행
  const wn = walkNote(pos); $('notePill').textContent = wn[0]; $('notePill').classList.toggle('hidden', wn[1]);
}
function hudClimb(st){
  if (autoActive()) autoSpeedTick();
  const tower = st.m.kind === 'tower';
  $('namePill').textContent = (tower ? '🏙 ' : '⛰ ') + tr(st.m.name) + (st.m.trailName ? ' · ' + tr(st.m.trailName) : '');
  $('altiPill').textContent = tower ? st.floor + T.floorUnit : T.alti + ' ' + Math.round(st.elev).toLocaleString() + 'm';
  $('sNextLabel').textContent = tower ? T.toTop : T.toSummit;
  $('sNextDist').textContent = Math.round(st.remain) + ' m';
  $('sNextName').textContent = (tower ? (st.m.floors - st.floor) + T.floorUnit + ' · ' : '') + T.approx + ' ' + Math.max(1, Math.round(st.remain / climbMpm())) + T.min;
  $('sTodayLabel').textContent = T.todayUp;
  $('sToday').textContent = Math.round(S.sessionM) + ' m';
  $('sTime').textContent = fmtTime(S.elapsed) + ' · ' + (autoActive() ? T.stepsN.replace('{n}', SENS.sessSteps) : T.machineFloors.replace('{n}', Math.floor(S.sessionM / FLOOR_M)));
  $('progBar').style.width = (st.ratio * 100).toFixed(1) + '%';
  const cn = climbNote(st); $('notePill').textContent = cn[0]; $('notePill').classList.toggle('hidden', cn[1]);
}
function refreshSpeedBox(flash){
  const v = isClimb() ? String(S.level) : S.speed.toFixed(1), u = isClimb() ? T.levelUnit : 'km/h';
  $('spdVal').textContent = v; $('spdUnit').textContent = u;
  if (flash && S.running){ $('flashVal').textContent = v; $('flashUnit').textContent = u;
    const el = $('speedFlash'); el.classList.remove('hidden'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.add('hidden'), 1100); }
}

/* ===================== 화면 켜짐 유지 ===================== */
let wakeLock = null;
async function keepAwake(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){ wakeLock = null; } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.running) keepAwake();
  if (document.visibilityState === 'hidden' && S.running) autosave(false);
});

/* ===================== 시작 화면 ===================== */
function setSpeed(v, flash){
  if (isClimb()){ S.level = Math.max(1, Math.min(LV_MAX, Math.round(v))); $('speedVal').textContent = S.level; }
  else { S.speed = Math.max(0, Math.min(S.act === 'bike' ? 60 : 25, Math.round(v*10)/10)); S.spd[S.act] = S.speed; $('speedVal').textContent = S.speed.toFixed(1); }
  refreshSpeedBox(flash); hudTick = 5;
}
const stepSize = () => (isClimb() || S.act === 'bike') ? 1 : 0.5, curSpeed = () => isClimb() ? S.level : S.speed;
function makePresets(list){
  $('presets').innerHTML = '';
  list.forEach(v => { const b = document.createElement('button'); b.textContent = isClimb() ? T.levelUnit + ' ' + v : v + ''; b.onclick = () => setSpeed(v); $('presets').appendChild(b); });
}

/* ---- 1) 지역: 나라 → 시·도 → 시·군 ---- */
function regionNodes(){
  const c = WORLD.regions.find(x => x.id === DB.region.country) || WORLD.regions[0];
  const p = c.children.find(x => x.id === DB.region.prov) || c.children[0];
  const ci = p.children.find(x => x.id === DB.region.city) || p.children[0];
  DB.region = { country: c.id, prov: p.id, city: ci.id };
  return { c, p, ci };
}
function refreshRegion(){
  const { c, p, ci } = regionNodes();
  const opt = (list, sel) => list.map(x => '<option value="' + x.id + '"' + (x.id === sel ? ' selected' : '') + '>' + tr(x.name) + '</option>').join('');
  $('rCountry').innerHTML = opt(WORLD.regions, c.id); $('rProv').innerHTML = opt(c.children, p.id); $('rCity').innerHTML = opt(p.children, ci.id);
}
$('rCountry').onchange = () => { DB.region = { country: $('rCountry').value }; saveDB(); refreshStart(); };
$('rProv').onchange = () => { DB.region = { country: DB.region.country, prov: $('rProv').value }; saveDB(); refreshStart(); };
$('rCity').onchange = () => { DB.region.city = $('rCity').value; saveDB(); refreshStart(); };

/* ---- 2) 코스: 그 지역의 길 · 산 · 빌딩 ---- */
function cityLists(){
  const cid = DB.region.city, city = WORLD.cities[cid];
  return { road: city ? Object.values(city.courses).filter(c => c.mode === 'distance').sort((a, b) => a.lengthM - b.lengthM) : [],
           mountain: MOUNTAINS.filter(t => t.cityId === cid), tower: TOWERS.filter(t => t.cityId === cid) };
}
let listOpen = false;
function refreshCourses(){
  const lists = cityLists(), tabs = ['road', 'mountain', 'tower'].filter(k => lists[k].length);
  if (!tabs.includes(DB.tab)) DB.tab = tabs[0];
  // 접힌 상태: 고른 코스 한 줄 + '코스 바꾸기'
  const picked = DB.pick.type === 'road' && ALL_ROADS[DB.pick.id] && WORLD.cities[DB.region.city] && WORLD.cities[DB.region.city].courses[DB.pick.id]
    ? 'road' : (DB.pick.type === 'climb' && TGT(DB.pick.id).cityId === DB.region.city ? TGT(DB.pick.id).kind : null);
  const open = listOpen || !picked;
  $('tabSeg').classList.toggle('hidden', !open || tabs.length < 2);
  $('courseToggle').classList.toggle('hidden', !picked);
  $('courseToggle').textContent = open ? T.closeList : T.changeCourse + ' (' + (lists.road.length + lists.mountain.length + lists.tower.length) + ')';
  if (!open){
    const savedTab = DB.tab; DB.tab = picked === 'road' ? 'road' : picked;
    renderCourseRows(lists, true); DB.tab = savedTab; return;
  }
  renderCourseRows(lists, false);
}
function renderCourseRows(lists, onlySel){
  const tabs = ['road', 'mountain', 'tower'].filter(k => lists[k].length);
  $('tabSeg').innerHTML = tabs.map(k => '<button data-tab="' + k + '" class="' + (k === DB.tab ? 'on' : '') + '">' + T['tab_' + k] + ' ' + lists[k].length + '</button>').join('');
  $('tabSeg').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { DB.tab = b.dataset.tab; saveDB(); refreshCourses(); });
  if (DB.tab === 'road'){
    $('courseList').innerHTML = lists.road.filter(c => !onlySel || c.id === COURSE.id).map(c => {
      const t = posTotal(c), laps = Math.floor(t / c.lengthM), pct = Math.floor((t % c.lengthM) / c.lengthM * 100);
      const hubs = c.landmarks.filter(l => l.hub).length || c.landmarks.length, sel = DB.pick.type === 'road' && c.id === COURSE.id;
      return '<div class="mrow' + (sel ? ' sel' : '') + '" data-road="' + c.id + '"><div><b>' + tr(c.name) + '</b><br><span class="muted"><b class="km">' +

function pickRoad(cid, id){

/* ---- 3) 운동 + 4) 방식(지금 운동 | 기록만 입력) ---- */
function setAct(a){
  const out = DB.zone === 'out', free = isFree(), upPick = !free && DB.pick.type === 'climb';
  if (free){   // 일반: 방구석 = 러닝머신·자전거·천국의 계단 / 바깥 = 걷기·조깅·자전거
    if (out && (a === 'tread' || ACTS[a].kind === 'up')) a = 'walk';
    else if (!out && (a === 'walk' || a === 'jog' || a === 'hike')) a = 'tread';
  }
  else if (upPick) a = out ? 'hike' : 'stair';                       // 방구석 = 천국의 계단 / 바깥 = 실제 등산·계단
  else if (out && a === 'tread') a = 'walk';                    // 바깥 걷기·조깅
  else if (!out && (a === 'walk' || a === 'jog')) a = 'tread';
  else if (ACTS[a].kind === 'up') a = out ? 'walk' : 'tread';
  S.act = a; DB.act = a; if (ACTS[a].kind === 'dist') DB.roadAct = a;
  const up = isClimb(), tower = !free && up && TGT(DB.climb.sel).kind === 'tower';
  const list = free ? (out ? [['walk', '🏃', T.aWalkOut], ['bike', '🚴', T.aBike]] : [['tread', '🏃', T.aFoot], ['bike', '🚴', T.aBike], ['stair', '🪜', T.aStair]])
             : up ? (out ? [['hike', '🥾', tower ? T.aRealStair : T.aHike]] : [['stair', '🪜', T.aStair]])
                  : (out ? [['walk', '🏃', T.aWalkOut], ['bike', '🚴', T.aBike]] : [['tread', '🏃', T.aFoot], ['bike', '🚴', T.aBike]]);
  $('actChips').innerHTML = list.map(([k, ic, nm]) => '<button data-act="' + k + '" class="' + (k === a ? 'on' : '') + '"><b>' + ic + '</b><span>' + nm + '</span></button>').join('');
  $('actChips').querySelectorAll('[data-act]').forEach(b => b.onclick = () => setAct(b.dataset.act));
  $('actChips').classList.toggle('hidden', list.length < 2); $('actTitle').classList.toggle('hidden', list.length < 2);
  $('goalBox').classList.add('hidden');   // 오늘 목표는 없앰: 다음 거점이 자동 목표
  $('speedTitle').textContent = a === 'stair' ? T.levelTitle : a === 'bike' ? T.speedBike : T.speedKmh;
  $('speedUnit').textContent = up ? '' : 'km/h';
  if (up){ makePresets([4, 6, 8, 10]); setSpeed(S.level); }
  else { makePresets(a === 'bike' ? [15, 20, 25, 30] : [4.5, 6, 8, 10]); setSpeed(S.spd[a] || 6); }
  // 바깥: 속도 고르기 없음. 길 = GPS 실시간 (못 쓰면 다녀온 기록 넣기), 산·빌딩 = 다녀온 기록 넣기
  $('speedArea').classList.toggle('hidden', out);
  const gpsOK = out && !up && gpsUsable();
  $('bStart').textContent = !out ? T.start : up ? T.hikeOut : gpsOK ? T.gpsStart : T.manualOut;
  refreshFree();
  $('gpsNote').classList.toggle('hidden', !out);
  $('gpsNote').textContent = up ? T.hikeHelp : gpsOK ? (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? T.gpsHelpApp : T.gpsHelp) : T.gpsNoHere;
  $('bZone').textContent = out ? T.zOutTitle : T.zInTitle;
  saveDB(); refreshStart(); drawIdle();
}

let addAct = null;

  const up = DB.pick.type === 'climb', tower = up && TGT(DB.climb.sel).kind === 'tower';
  const list = up ? [['hike', '🥾', tower ? T.aRealStair : T.aHike], ['stair', '🪜', T.aStair]] : [['walk', '🌳', T.aWalkOut], ['tread', '🏃', T.aFoot], ['bike', '🚴', T.aBike]];

function recentLive(up){   // 3시간 안에 같은 코스에서 실시간으로 쌓인 기록
  const target = up ? DB.climb.sel : COURSE.id, now = Date.now();
  return DB.records.find(r => r.src === 'live' && now - r.id < 3 * 3600 * 1000 && r.credit && r.credit.target === target && (ACTS[r.act] || ACTS.tread).kind === (up ? 'up' : 'dist'));
}
$('bOutSave').onclick = () => {
  const amt = parseFloat($('oAmt').value), min = parseFloat($('oMin').value) || 0, act = addAct, up = ACTS[act].kind === 'up';
  if (!(amt > 0)){ $('outMsg').textContent = T.badNum; return; }

  if (live){
    $('dupBody').textContent = recLine(live) + '\n\n→ ' + (up ? Math.round(amt) + 'm' : amt.toFixed(2) + 'km') + (min ? ' · ' + min + T.min : '') + '\n' + T.dupAsk;
    $('dupBox').classList.remove('hidden');
    $('dupFix').onclick = () => { $('dupBox').classList.add('hidden'); applyEdit(live, amt, min || null); $('addBox').classList.add('hidden'); toastMsg('✅ ' + T.fixedTag + ': ' + recLine(live)); refreshRec(); };
    $('dupNew').onclick = () => { $('dupBox').classList.add('hidden'); saveManual(amt, min, act); };
    return;

function saveManual(amt, min, act){
  const id = Date.now(), up = ACTS[act].kind === 'up', rec = { id, date: new Date(id).toISOString(), act, src: 'manual', sec: Math.round(min * 60), distM: 0, upM: 0, passed: [] };
  let msg, hubs = [];
  if (up){
    const m = TGT(DB.climb.sel), before = climbTotal(m.id);
    rec.upM = Math.round(amt); rec.credit = { course: 'climb', target: m.id, m: amt };
    if (act === 'hike') rec.real = m.id;
    rec.passed = climbPassed(m, before, before + amt).map(p => p.short || p.name);
    msg = tr(m.name) + ' +' + rec.upM + 'm' + (rec.real ? ' · ' + T.realDone : '');
  } else {
    const before = walkTotal(), ps = walkPassed(before, before + amt * 1000).filter(p => !p.lap);
    rec.distM = Math.round(amt * 1000); rec.credit = { course: 'walk', target: COURSE.id, m: rec.distM };
    rec.passed = ps.map(p => p.name); hubs = ps.filter(p => p.hub).map(p => p.name);
    msg = tr(COURSE.short || COURSE.name) + ' +' + amt.toFixed(2) + 'km';
  }
  if (isFree()){ delete rec.credit; rec.passed = []; rec.free = { goal: up ? (DB.free.floors || 0) : (DB.free.km || 0), unit: up ? 'floor' : 'km' }; hubs = []; msg = T.freeTag + ' ' + (up ? rec.upM + 'm' : amt.toFixed(2) + 'km') + ' · ' + T.apLater; }   // 일반: 테마에 안 쌓음
  else if (siteOK(recPlace(rec))) rec.site = true;
  upsertRecord(rec);
  $('addBox').classList.add('hidden'); refreshRec();
  toastMsg('✅ ' + msg + (hubs.length ? ' · 🚩 ' + hubs.join(', ') : ''));
}

function fillEnd(){
  const a = ACTS[S.act]; fillTrack();
  $('applyBox').classList.toggle('hidden', !S.free); $('passedWrap').classList.toggle('hidden', !!S.free);
  if (S.free){
    const up = isClimb(), amt = up ? Math.round(S.sessionM) + ' m (' + Math.floor(S.sessionM / FLOOR_M) + T.floorUnit + ')' : (S.sessionM / 1000).toFixed(2) + ' km';
    $('endSummary').innerHTML = T.freeSum.replace('{g}', freeGoalText(S.freeGoal, up)) + '<br>' + a.icon + ' ' + T[a.key] + ' <b>' + amt + '</b> · ' + fmtTime(S.elapsed) +
      (S.freeHit ? '<br>🎉 ' + T.freeDone.replace('🎉 ', '').replace('{g}', freeGoalText(S.freeGoal, up)) : '');
    $('fixLabel').textContent = up ? T.fixFloors : T.fixKm; $('fixIn').placeholder = up ? T.floorUnit : 'km';
    fillApply(); return;
  }

    const st = climbState(), tower = st.m.kind === 'tower';
    $('endSummary').innerHTML = T.todayUp + ' <b>' + Math.round(S.sessionM) + ' m</b> · ' + fmtTime(S.elapsed) + '<br>' +
      (tower ? '🏙 ' : '⛰ ') + tr(st.m.name) + ' <b>' + Math.floor(st.ratio * 100) + '%</b>' + (st.done ? ' · ✅ ' + st.done + T.times : '');
    $('fixLabel').textContent = T.fixFloors; $('fixIn').placeholder = T.floorUnit;
  } else {

    $('fixLabel').textContent = T.fixKm; $('fixIn').placeholder = 'km';

  fillEnd(); $('endScreen').classList.remove('hidden');

$('bFix').onclick = () => {   // 기계에 찍힌 숫자로 맞추기
  const v = parseFloat($('fixIn').value);
  if (!(v >= 0)){ $('fixMsg').textContent = T.badNum; return; }
  const oldM = S.sessionM, usedSensor = SENS.sessDist > 0;
  if (S.free) S.sessionM = isClimb() ? v * FLOOR_M : v * 1000;
  else if (isClimb()){ const m = TGT(DB.climb.sel), b = S.startTotal + S.sessionM; S.sessionM = v * FLOOR_M;
    if (S.startTotal + S.sessionM > b) climbPassed(m, b, S.startTotal + S.sessionM).forEach(p => S.passed.push(p.short || p.name)); }
  else { const b = totalNow(); S.sessionM = v * 1000;
    if (totalNow() > b) walkPassed(b, totalNow()).filter(p => !p.lap).forEach(p => S.passed.push(p.name)); }
  let cal = false;
  if (usedSensor && oldM > 50 && S.sessionM > 0){   // 센서로 잰 거리 vs 기계 숫자 → 보폭 자동 보정 (반만 반영해서 천천히 맞춤)
    const r = Math.max(0.5, Math.min(2, S.sessionM / oldM)), k = 1 + (r - 1) * 0.5;
    if (isClimb()) DB.stride.stair *= k; else { DB.stride.walk *= k; DB.stride.run *= k; }
    saveDB(); cal = true; SENS.sessDist = 0;
  }
  autosave(true); fillEnd(); $('fixMsg').textContent = '✅ ' + (cal ? T.calibrated : T.fixOk);
};

  $('sumToday').innerHTML = (tDist || !tUp ? (tDist/1000).toFixed(1) + 'km' : '') + (tUp ? (tDist ? '<br>' : '') + tUp.toLocaleString() + 'm' : '');
  const up = DB.pick.type === 'climb';
  if (up){
    const cs = climbState();
    $('sumPickName').textContent = (cs.m.kind === 'tower' ? '🏙 ' : '⛰ ') + tr(cs.m.name) + ' · ' + (cs.m.trailName ? tr(cs.m.trailName) : tr(cs.m.cityName));
    $('sumPick').textContent = Math.floor(cs.ratio * 100) + '% · ' + Math.round(cs.remain) + 'm ' + T.left + (cs.done ? ' · ✅ ' + cs.done + T.times : '');

    const wt = walkTotal();

    $('sumPick').textContent = ((wt % L)/1000).toFixed(1) + ' / ' + (L/1000).toFixed(L % 1000 ? 1 : 0) + 'km' + (wt >= L ? ' · ✅ ' + Math.floor(wt / L) + T.times : '');
  }
  refreshCourses(); refreshGoal(); refreshStamps(); refreshSite();

  // 기록
  const rec = DB.records.filter(r => r.src !== 'legacy').slice(0, 3);
  $('histList').innerHTML = rec.length ? rec.map(r => {
    const a = ACTS[r.act] || ACTS.tread, d = new Date(r.date), c = r.credit || {};
    const where = c.course === 'climb' ? tr(TGT(c.target).short || TGT(c.target).name).replace('지리산 ', '') : roadName(c.course === 'sangnim' ? 'sangnim-3k' : c.target);
    const amt = a.kind === 'up' ? r.upM + 'm' : (r.distM/1000).toFixed(2) + 'km';
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + a.icon + ' <b>' + amt + '</b> ' + where + (r.sec >= 30 ? ' · ' + Math.round(r.sec/60) + T.min : '') + (r.real ? ' · ' + T.realDone : '') + (r.src === 'manual' ? ' ✍' : '');
  }).join('<br>') : '<span class="muted">' + T.noRecord + '</span>';
  const sumBy = (acts, f) => DB.records.filter(r => acts.includes(r.act)).reduce((a, r) => a + (r[f] || 0), 0);
  const foot = sumBy(['tread', 'walk', 'jog'], 'distM'), bike = sumBy(['bike'], 'distM'), upAll = sumBy(['stair', 'hike'], 'upM'), parts = [];
  if (foot) parts.push(T.aFoot + ' ' + (foot/1000).toFixed(1) + 'km');
  if (bike) parts.push(T.aBike + ' ' + (bike/1000).toFixed(1) + 'km');
  if (upAll) parts.push(T.upTotal + ' ' + upAll.toLocaleString() + 'm');
  $('totals').textContent = parts.length ? T.cum + ' — ' + parts.join(' · ') : '';
}
function drawIdle(){
  resize();
  if (isClimb()){ const st = climbState(); if (st.m.kind === 'tower') renderTower(st, 0, 0); else renderClimb(st, 0, 0); }
  else { const pos = walkTotal() % L; render(pos, 0, 0, styleAt(pos)); }
}

/* ===================== 산 1인칭 그리기 ===================== */
const ALPINE = { sky1L:'#93c9e6', sky2L:'#e6f2ea', sky1H:'#3a78c0', sky2H:'#d4e8f6',
  groundL:'#4a6e3a', groundH:'#7b7a5c', treadL:'#b9b1a0', riser:'#8e8576', rock:'#8d8a80' };

function renderClimb(st, bob, sway){
  const f = H * 0.95, eye = 1.6 + bob;
  const RISE = 0.15, TREAD = 0.45, NST = 34, HALFW = 0.75, A = 1.4;
  const hz0 = H * 0.42, hz = hz0 + (eye - NST * RISE) * f / (NST * TREAD + 0.6) + 2;
  const alt = Math.max(0, Math.min(1, (st.elev - 400) / 1500));

  const sky = ctx.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, mix(ALPINE.sky1L, ALPINE.sky1H, alt)); sky.addColorStop(1, mix(ALPINE.sky2L, ALPINE.sky2H, alt));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hz + 2);
  if (img('climb_bg_sky')) drawBand(img('climb_bg_sky'), hz + 2, hz + 2, st.k * W * 0.37);
  drawRidge(ridgeFar, mix('#a9c3c9', '#9fb3c8', alt), hz + 1, H * 0.07, st.k * W * 0.37);
  const grow = Math.min(st.ratio, 0.7) / 0.7, sink = st.ratio > 0.7 ? 1 - (st.ratio - 0.7) / 0.3 * 0.75 : 1;
  const pw = W * (0.45 + 0.4 * grow), ph = H * (0.06 + 0.14 * grow) * sink;
  if (img('climb_summit')){ const im = img('climb_summit'), w = pw * 2, h = Math.max(ph * 1.4, w * im.height / im.width * sink); ctx.drawImage(im, W/2 - w/2, hz + 2 - h, w, h); }
  else {
  ctx.fillStyle = mix('#5d8466', '#6f7a6c', alt);
  ctx.beginPath(); ctx.moveTo(W/2 - pw, hz + 2);
  ctx.quadraticCurveTo(W/2 - pw*0.35, hz - ph*0.55, W/2 - pw*0.06, hz - ph);
  ctx.lineTo(W/2 + pw*0.06, hz - ph); ctx.quadraticCurveTo(W/2 + pw*0.4, hz - ph*0.5, W/2 + pw, hz + 2); ctx.closePath(); ctx.fill();
  }
  if (st.ratio > 0.6 && !img('climb_summit')){ ctx.fillStyle = '#d8d3c4'; const s = H * 0.006 * (1 + st.ratio); ctx.fillRect(W/2 - s, hz - ph - s*4, s*2, s*4); }
  if (st.ratio > 0.7){
    ctx.globalAlpha = Math.min(0.8, (st.ratio - 0.7) * 2.6); ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 7; i++){ ctx.beginPath(); ctx.ellipse(W * (i/6), hz + 2, W*0.18, H*0.018, 0, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = mix(ALPINE.groundL, ALPINE.groundH, alt); ctx.fillRect(0, hz, W, H - hz);

  const stepF = st.climbed / STEP_M, n0 = Math.floor(stepF);
  const wind = n => A * (Math.sin(n / 22) - Math.sin(stepF / 22));
  const P3 = (z, h, x) => { const s = f / Math.max(z, 0.3); return { x: W/2 + (x - sway) * s, y: hz0 + (eye - h) * s, s }; };
  const groundCol = mix(ALPINE.groundL, ALPINE.groundH, alt), groundCol2 = mix('#557a43', '#868466', alt);
  const treeP = Math.max(0.08, 0.75 - Math.max(0, st.elev - 1300) / 700);
  for (let k = NST; k >= -1; k--){
    const n = n0 + k, r = n - stepF, z = r * TREAD + 0.6; if (z < 0.35) continue;
    const h = r * RISE, x = wind(n), x2 = wind(n + 1), fog = Math.min(1, z / 18) * 0.55;
    const a = P3(z, h, x), b = P3(z, h + RISE, x), c = P3(z + TREAD, h + RISE, x2);
    ctx.fillStyle = mix(n % 2 ? groundCol : groundCol2, '#cfdbe0', fog); ctx.fillRect(0, c.y, W, a.y - c.y + 1);
    ctx.fillStyle = mix(ALPINE.treadL, '#dfe6ea', fog);
    quad(b.x - HALFW*b.s, b.y, b.x + HALFW*b.s, b.y, c.x + HALFW*c.s, c.y, c.x - HALFW*c.s, c.y);
    ctx.fillStyle = mix(ALPINE.riser, '#c9d2d6', fog);
    quad(a.x - HALFW*a.s, a.y, a.x + HALFW*a.s, a.y, b.x + HALFW*b.s, b.y, b.x - HALFW*b.s, b.y);
    ctx.fillStyle = mix('#6b5236', '#c4ccd0', fog); ctx.fillRect(b.x - HALFW*b.s, b.y - 0.03*b.s, HALFW*2*b.s, 0.05*b.s);
    for (let side = -1; side <= 1; side += 2){
      if (z < 2.2) continue;
      const rr = rnd(n * 2 + (side > 0 ? 1 : 0)), off = side * (HALFW + 1.0 + rnd(n * 3 + side) * 4.5), p = P3(z, h, x + off);
      if (rr < treeP){ ctx.globalAlpha = 1 - fog * 0.6; drawTree(p.x, p.y, p.s * (1 - 0.45 * alt), rnd(n * 5 + side), z); ctx.globalAlpha = 1; }
      else if (rr > 1 - 0.35 * alt - 0.08){
        ctx.fillStyle = mix(ALPINE.rock, '#cfd6da', fog);
        ctx.beginPath(); ctx.ellipse(p.x, p.y - 0.36*p.s, 0.6*p.s, 0.36*p.s, 0, 0, 7); ctx.fill();
      }
    }
  }
}

/* ===================== 빌딩 계단실 1인칭 그리기 =====================
   비상계단: 한 번 꺾일 때마다 화면이 좌우로 뒤집히고, 층참 벽에 층 번호와 창문.
   창밖 도시는 오를수록 아래로 내려가고, 높아지면 구름이 보입니다. */
const TOWER_FLIGHT = 14, TOWER_TURN = 11;   // 한 번에 보이는 계단 14칸, 11칸 오르면 꺾임 (층참 직전에 다음 계단으로)
function renderTower(st, bob, sway){
  const f = H * 0.95, eye = 1.6 + bob, hz0 = H * 0.42;
  const RISE = 0.17, TREAD = 0.28, HW = 0.62, CEIL = 2.7;
  const stepF = st.climbed / STEP_M;
  const flight = Math.floor(stepF / TOWER_TURN), pos = stepF - flight * TOWER_TURN;
  const mirror = flight % 2 ? -1 : 1;
  const P3 = (z, h, x) => { const s = f / Math.max(z, 0.3); return { x: W/2 + (x * mirror - sway) * s, y: hz0 + (eye - h) * s, s }; };

  const rL = TOWER_FLIGHT - pos, zL = rL * TREAD + 0.6, hL = rL * RISE, zW = zL + 1.3;   // 층참 / 벽
  const wallC = '#d9d4c7', wallD = '#bdb7a8', stepC = '#9a9a96', riserC = '#7c7c78';

  ctx.fillStyle = '#4a4a48'; ctx.fillRect(0, 0, W, H);   // 천장·그림자

  // 층참 정면 벽
  const wl = P3(zW, hL, -HW), wr = P3(zW, hL, HW + 1.4), wt = P3(zW, hL + CEIL, -HW);
  ctx.fillStyle = wallC; ctx.fillRect(Math.min(wl.x, wr.x), wt.y, Math.abs(wr.x - wl.x), wl.y - wt.y);
  // 창문 + 바깥 풍경
  const w0 = P3(zW, hL + 1.0, 0.05), w1 = P3(zW, hL + 2.2, 1.15);
  const wx = Math.min(w0.x, w1.x), ww = Math.abs(w1.x - w0.x), wy = w1.y, wh = w0.y - w1.y;
  if (ww > 4){
    ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
    const high = Math.min(1, st.elev / 600);
    const g = ctx.createLinearGradient(0, wy, 0, wy + wh);
    g.addColorStop(0, mix('#8cc4ea', '#3d7cc4', high)); g.addColorStop(1, mix('#e9f3f8', '#cfe3f3', high));
    ctx.fillStyle = g; ctx.fillRect(wx, wy, ww, wh);
    const winIm = st.elev > 280 ? (img('tower_window_clouds') || img('tower_window_city')) : img('tower_window_city');
    if (winIm){ const dropI = Math.min(0.6, st.elev / 900) * wh; ctx.drawImage(winIm, wx - ww*0.1, wy + dropI - wh*0.1, ww*1.2, wh*1.2); }
    const drop = Math.min(1.6, st.elev / 250);            // 높을수록 도시가 창 아래로
    const base = wy + wh * (0.55 + drop * 0.45);
    if (!winIm) for (let i = 0; i < 9; i++){
      const bw = ww / 7, bx = wx + (i - 1) * bw * 0.95 + (flight % 3) * bw * 0.2, bh = wh * (0.15 + rnd(i + flight * 7) * 0.5) * (1 - drop * 0.35);
      ctx.fillStyle = i % 2 ? '#6d7f8f' : '#7f909e'; ctx.fillRect(bx, base - bh, bw * 0.85, bh + wh);
    }
    if (!winIm && st.elev > 280){ ctx.globalAlpha = Math.min(0.85, (st.elev - 280) / 300); ctx.fillStyle = '#fff';
      for (let i = 0; i < 4; i++){ ctx.beginPath(); ctx.ellipse(wx + ww * (i / 3), base - wh * 0.05, ww * 0.35, wh * 0.06, 0, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1; }
    ctx.restore();
    ctx.strokeStyle = '#6e6a60'; ctx.lineWidth = Math.max(2, 0.05 * w0.s); ctx.strokeRect(wx, wy, ww, wh);
    ctx.beginPath(); ctx.moveTo(wx + ww/2, wy); ctx.lineTo(wx + ww/2, wy + wh); ctx.stroke();
  }
  // 층 번호 판
  if (st.m.floors){
    const nextFloor = Math.min(st.m.floors, Math.max(1, Math.round((st.climbed + rL * STEP_M) / st.m.gain * st.m.floors)));
    const s0 = P3(zW, hL + 1.45, -HW + 0.08), s1 = P3(zW, hL + 2.05, -0.05);
    const sx = Math.min(s0.x, s1.x), sw = Math.abs(s1.x - s0.x), sh = s0.y - s1.y;
    if (sw > 6){
      ctx.fillStyle = '#1f6b45'; ctx.fillRect(sx, s1.y, sw, sh);
      ctx.fillStyle = '#fff'; ctx.font = '800 ' + Math.round(sh * 0.62) + 'px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nextFloor + 'F', sx + sw/2, s1.y + sh * 0.76); ctx.textAlign = 'left';
    }
  }
  // 층참 바닥
  const l0 = P3(zL, hL, -HW), l1 = P3(zL, hL, HW + 1.4), l2 = P3(zW, hL, HW + 1.4), l3 = P3(zW, hL, -HW);
  ctx.fillStyle = '#8f8f8a'; quad(l0.x, l0.y, l1.x, l1.y, l2.x, l2.y, l3.x, l3.y);

  // 옆벽 (왼쪽은 층참 끝까지, 오른쪽은 층참 앞까지 — 오른쪽으로 꺾여 올라감)
  const zN = 0.35, hN = (zN - 0.6) / TREAD * RISE;
  const wallPoly = (x, zEnd, hEnd, col) => {
    const a = P3(zN, hN, x), b = P3(zEnd, hEnd, x), c = P3(zEnd, hEnd + CEIL, x), d = P3(zN, hN + CEIL, x);
    ctx.fillStyle = col; quad(a.x, a.y + H, b.x, b.y, c.x, c.y, d.x, d.y - H);
  };
  wallPoly(-HW, zL, hL, wallD);
  { const a = P3(zL, hL, -HW), b = P3(zW, hL, -HW), c = P3(zW, hL + CEIL, -HW), d = P3(zL, hL + CEIL, -HW); ctx.fillStyle = wallD; quad(a.x, a.y, b.x, b.y, c.x, c.y, d.x, d.y); }
  wallPoly(HW, zL, hL, '#cdc7b9');
  // 난간
  { const zr = 1.2, a = P3(zr, (zr - 0.6) / TREAD * RISE + 0.9, HW - 0.05), b = P3(zL, hL + 0.9, HW - 0.05);
    ctx.strokeStyle = '#3d3d3b'; ctx.lineWidth = Math.min(6 * DPR, Math.max(2, 0.04 * b.s)); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }

  // 계단 (먼 곳 → 가까운 곳), 모서리에 노란 미끄럼 방지 띠
  for (let j = TOWER_FLIGHT - 1; j >= 0; j--){
    const r = j - pos, z = r * TREAD + 0.6; if (z < 0.35) continue;
    const h = r * RISE;
    const a = P3(z, h, -HW), a2 = P3(z, h, HW), b = P3(z, h + RISE, -HW), b2 = P3(z, h + RISE, HW), c = P3(z + TREAD, h + RISE, -HW), c2 = P3(z + TREAD, h + RISE, HW);
    ctx.fillStyle = stepC; quad(b.x, b.y, b2.x, b2.y, c2.x, c2.y, c.x, c.y);
    ctx.fillStyle = riserC; quad(a.x, a.y, a2.x, a2.y, b2.x, b2.y, b.x, b.y);
    ctx.fillStyle = '#e2b934'; const t = Math.max(1.5, 0.035 * b.s); ctx.fillRect(Math.min(b.x, b2.x), b.y - t, Math.abs(b2.x - b.x), t);
  }
  // 꺾이는 순간 살짝 어둡게
  if (pos < 0.7){ ctx.fillStyle = 'rgba(0,0,0,' + ((0.7 - pos) / 0.7 * 0.45).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
}

/* 오른쪽 위: 산 = 높이 그래프 / 빌딩 = 건물 모양 */
function drawMapClimb(st){
  const sz = mapCv.width, g = mctx, d = DPR;
  g.clearRect(0, 0, sz, sz);
  if (st.m.kind === 'tower'){
    const bx = sz/2 - 14*d, bw = 28*d, top = 22*d, bot = sz - 22*d;
    g.fillStyle = '#c9d6e2'; g.beginPath(); g.moveTo(bx, bot); g.lineTo(bx + 5*d, top + 8*d); g.lineTo(sz/2, top); g.lineTo(bx + bw - 5*d, top + 8*d); g.lineTo(bx + bw, bot); g.closePath(); g.fill();
    g.strokeStyle = '#5d7790'; g.lineWidth = 1.5*d; g.stroke();
    const py = bot - (bot - top) * st.ratio;
    g.fillStyle = '#e8574a'; g.strokeStyle = '#fff'; g.lineWidth = 2*d; g.beginPath(); g.arc(sz/2, py, 5*d, 0, 7); g.fill(); g.stroke();
    g.fillStyle = '#333'; g.font = '700 ' + (10*d) + 'px sans-serif'; g.textAlign = 'right';
    g.fillText(st.m.floors + 'F', sz - 8*d, top + 4*d); g.font = (10*d) + 'px sans-serif';
    g.fillText(st.m.summit + 'm', sz - 8*d, top + 17*d);
    g.textAlign = 'center'; g.fillText(tr(st.m.short || st.m.name), sz/2, sz - 7*d); g.textAlign = 'left';
    return;
  }
  const x0 = 12*d, x1 = sz - 12*d, y0 = sz - 24*d, y1 = 26*d;
  g.fillStyle = '#cfe0c9';
  g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(x0 + (x1-x0)*0.55, y0 - (y0-y1)*0.35, x1, y1); g.lineTo(x1, y0); g.closePath(); g.fill();
  g.strokeStyle = '#4f9a5c'; g.lineWidth = 3*d;
  g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(x0 + (x1-x0)*0.55, y0 - (y0-y1)*0.35, x1, y1); g.stroke();
  const t = st.ratio, u = 1 - t;
  const px = u*u*x0 + 2*u*t*(x0 + (x1-x0)*0.55) + t*t*x1, py = u*u*y0 + 2*u*t*(y0 - (y0-y1)*0.35) + t*t*y1;
  g.fillStyle = '#e8574a'; g.strokeStyle = '#fff'; g.lineWidth = 2*d; g.beginPath(); g.arc(px, py, 5*d, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#333'; g.font = '700 ' + (11*d) + 'px sans-serif'; g.textAlign = 'right';
  g.fillText('▲' + st.m.summit.toLocaleString() + 'm', x1, y1 - 8*d);
  g.textAlign = 'left'; g.font = (10*d) + 'px sans-serif'; g.fillText(tr(st.m.name), x0, sz - 8*d);
}


/* 실내자전거: 달리는 중 계기판 거리로 맞추기 → 지금까지 거리 반영 + 평균 속도로 화면 속도 자동 조정 */
$('bSync').onclick = () => { $('syncIn').value = ''; $('syncBox').classList.remove('hidden'); setTimeout(() => $('syncIn').focus(), 50); };
$('bSyncX').onclick = () => $('syncBox').classList.add('hidden');
$('bSyncOk').onclick = () => {
  const v = parseFloat($('syncIn').value);
  if (!(v >= 0)) return;
  const target = v * 1000 * BIKE_FACTOR, delta = target - S.sessionM;
  if (delta > 0) advance(delta); else S.sessionM = target;
  if (S.elapsed > 30 && v > 0) setSpeed(v / (S.elapsed / 3600), true);
  $('syncBox').classList.add('hidden'); autosave(false); hudTick = 5;
};

/* =====================================================================
   오늘 목표 (고른 길 코스 위)  —  기본: 다음 거점 / 거점 고르기 / 거리
   + 지나온 길: 거점·명소 도착 횟수는 코스 누적 거리에서 계산 (따로 저장 안 함)
   ===================================================================== */
DB.goal = { type: 'next', spot: null, km: 3 };   // 목표 고르기는 없앰 (항상 다음 거점)
const aheadDist = (lm, total) => { const d = ((lm.at - total % L) % L + L) % L; return d < 1 ? L : d; };
function nextSpotFrom(total){ let b = null; HUBS.forEach(lm => { const d = aheadDist(lm, total); if (!b || d < b.d) b = { lm, d }; }); return b; }
function lastSpotWithin(total, dist){ let b = null; HUBS.forEach(lm => { const d = aheadDist(lm, total); if (d <= dist && (!b || d > b.d)) b = { lm, d }; }); return b; }
function goalFrom(total){
  const g = DB.goal;
  if (g.type === 'dist') return { at: total + g.km * 1000, name: g.km + 'km', dist: true };
  const lm = g.type === 'spot' ? (HUBS.find(x => x.id === g.spot) || nextSpotFrom(total).lm) : nextSpotFrom(total).lm;
  return { at: total + aheadDist(lm, total), name: tr(lm.name), lm };
}
function stampCount(lm, total){ return total >= lm.at ? Math.floor((total - lm.at) / L) + 1 : 0; }
function firstVisit(lm){ const n = tr(lm.name), r = DB.records.filter(x => creditOf(x, COURSE) && (x.passed || []).includes(n)).sort((a, b) => a.id - b.id)[0];
  return r ? new Date(r.date).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }) : null; }

function refreshGoal(){
  const wt = walkTotal(), g = DB.goal;
  document.querySelectorAll('[data-goal]').forEach(b => b.classList.toggle('on', b.dataset.goal === g.type));
  $('distPresets').classList.toggle('hidden', g.type !== 'dist');
  if (g.type === 'dist'){
    const ks = S.act === 'bike' ? [5, 10, 15, 20] : [3, 5, 8, 10];
    if (!ks.includes(g.km)) g.km = ks[0];
    $('distPresets').innerHTML = ks.map(k => '<button class="' + (g.km === k ? 'on' : '') + '" data-km="' + k + '">' + k + ' km</button>').join('');
    $('distPresets').querySelectorAll('[data-km]').forEach(b => b.onclick = () => { DB.goal.km = +b.dataset.km; saveDB(); refreshGoal(); });
    const reach = lastSpotWithin(wt, g.km * 1000), n = nextSpotFrom(wt);
    $('goalList').innerHTML = '<div class="gline">🎯 <b>' + g.km + ' km</b>' + (reach ? ' <span>' + T.reachBy.replace('{s}', tr(reach.lm.name)) + '</span>' : '') +
      '<small>' + T.nextHub + ' ' + tr(n.lm.name) + ' ' + fmtM(n.d) + '</small></div>';
  } else if (g.type === 'spot'){
    if (!HUBS.find(x => x.id === g.spot)) g.spot = nextSpotFrom(wt).lm.id;
    $('goalList').innerHTML = HUBS.map(lm => { const d = aheadDist(lm, wt), n = stampCount(lm, wt);
      return '<div class="mrow' + (g.spot === lm.id ? ' sel' : '') + '" data-spot="' + lm.id + '"><div><b>🚩 ' + tr(lm.name) + '</b><br><span class="muted">' + T.aheadOf.replace('{d}', fmtM(d)) + '</span></div>' +
        '<div class="r">' + (n ? n + T.times : '') + '</div></div>'; }).join('');
    $('goalList').querySelectorAll('[data-spot]').forEach(r => r.onclick = () => { DB.goal.spot = r.dataset.spot; saveDB(); refreshGoal(); refreshStamps(); });
  } else {
    const n = nextSpotFrom(wt);
    $('goalList').innerHTML = '<div class="gline">🚩 <b>' + tr(n.lm.name) + '</b> · ' + fmtM(n.d) + '<small>' + tr(n.lm.desc) + '</small></div>';
  }
}

/* =====================================================================
   폰 움직임 센서로 걸음 자동 인식 (트레드밀·천국의 계단, 폰을 쥐고 운동)
   · 걸음 1번 = 트레드밀: 보폭만큼 / 계단: 한 칸(20cm)
   · 끝나고 기계 숫자로 맞추면 보폭을 스스로 고침 → 쓸수록 정확
   · 센서가 막혀 있으면(예: Claude 앱 안) 3초 뒤 수동으로 바뀜
   ===================================================================== */
if (!DB.stride) DB.stride = { walk: 0.72, run: 1.0, stair: 1.0 };
DB.autoSensor = false;   // 폰 센서 자동은 아직 안 됨 → 버튼 숨김 (외부 주소 단계에서 다시)
const SENS = { on: false, ok: false, times: [], lastPeak: 0, avg: 9.8, f: 0, rising: false, sessSteps: 0, sessDist: 0 };
const autoCapable = () => S.act === 'tread' || S.act === 'stair';
const autoActive = () => SENS.on && SENS.ok;
function toastMsg(m){ const t = $('toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hidden'), 2600); }
async function sensorStart(){
  Object.assign(SENS, { on: false, ok: false, times: [], sessSteps: 0, sessDist: 0, rising: false, f: 0 });
  if (!DB.autoSensor || !autoCapable() || typeof DeviceMotionEvent === 'undefined'){ updateAutoUI(); return; }
  try {
    if (typeof DeviceMotionEvent.requestPermission === 'function'){   // 아이폰: 허용 필요
      const r = await DeviceMotionEvent.requestPermission(); if (r !== 'granted'){ toastMsg(T.sensorNo); updateAutoUI(); return; }
    }
  } catch(e){ toastMsg(T.sensorNo); updateAutoUI(); return; }
  window.addEventListener('devicemotion', onMotion); SENS.on = true;
  setTimeout(() => { if (S.running && SENS.on && !SENS.ok){ sensorStop(); toastMsg(T.sensorNo); updateAutoUI(); refreshSpeedBox(false); } }, 3000);
  updateAutoUI();
}
function sensorStop(){ window.removeEventListener('devicemotion', onMotion); SENS.on = false; updateAutoUI(); }
function onMotion(e){
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  if (!SENS.ok){ SENS.ok = true; updateAutoUI(); refreshSpeedBox(false); }
  const t = performance.now(), mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
  SENS.avg = SENS.avg * 0.98 + mag * 0.02;            // 기준선(중력)
  SENS.f = SENS.f * 0.6 + (mag - SENS.avg) * 0.4;      // 흔들림 완화
  if (!SENS.rising && SENS.f > 1.2 && t - SENS.lastPeak > 260){ SENS.rising = true; SENS.lastPeak = t; onStep(t); }

}
function cadence(){   // 분당 걸음 (최근 6초)
  const n = SENS.times.length, now = performance.now();
  if (n < 3 || now - SENS.times[n-1] > 2500) return 0;

}
function onStep(t){
  if (!S.running || S.paused) return;
  SENS.times.push(t); while (SENS.times.length && t - SENS.times[0] > 6000) SENS.times.shift();
  SENS.sessSteps++;
  if (isClimb()){ const d = STEP_M * DB.stride.stair; SENS.sessDist += d; advanceClimb(d); }
  else { const d = cadence() >= 140 ? DB.stride.run : DB.stride.walk; SENS.sessDist += d; advance(d); }
}
function autoSpeedTick(){
  const c = cadence();
  if (isClimb()){ $('spdVal').textContent = Math.round(c); $('spdUnit').innerHTML = T.spmUnit2 + ' <em>' + T.autoTag + '</em>'; }
  else { S.speed = Math.round(c * (c >= 140 ? DB.stride.run : DB.stride.walk) * 60 / 100) / 10; $('spdVal').textContent = S.speed.toFixed(1); $('spdUnit').innerHTML = 'km/h <em>' + T.autoTag + '</em>'; }
}
function updateAutoUI(){
  $('bAuto').classList.add('hidden');
  $('bAuto').classList.toggle('on', !!DB.autoSensor);
  $('bAuto').innerHTML = '<span>' + T.autoBtn + '</span><i>' + (DB.autoSensor ? T.autoOn : T.autoOff) + '</i>';
  ['bDown', 'bUp'].forEach(id => $(id).classList.toggle('dim', autoActive()));
}
$('bAuto').onclick = () => { DB.autoSensor = !DB.autoSensor; saveDB(); updateAutoUI(); };


/* =====================================================================
   고도 (코스 설정의 elev: [거리, 해발] 점들을 이어서 계산)
   ===================================================================== */
const ELEV = COURSE.elev || [[0, 165], [L, 165]];
function elevAt(d){
  d = ((d % L) + L) % L;
  for (let i = 1; i < ELEV.length; i++) if (d <= ELEV[i][0]){ const a = ELEV[i-1], b = ELEV[i], t = (d - a[0]) / ((b[0] - a[0]) || 1); return a[1] + (b[1] - a[1]) * t; }
  return ELEV[ELEV.length - 1][1];
}
const gradeAt = d => (elevAt(Math.min(L - 1, d + 60)) - elevAt(Math.max(0, d - 60))) / 120 * 100;
function gradeText(d){ const g = gradeAt(d); return g > 2.5 ? T.up + ' ' + Math.round(g) + '%' : g < -2.5 ? T.down + ' ' + Math.round(-g) + '%' : T.flat; }
const ELEV_MIN = Math.min(...ELEV.map(e => e[1])), ELEV_MAX = Math.max(...ELEV.map(e => e[1]));

/* =====================================================================
   지도 화면: 작은 지도를 누르면 코스 지도가 전면에 → 이동 모습을 지도 위에서 봄
   오른쪽 위는 '다음 거점 사진 + 고도 그래프 + 오르막/내리막' 정보칸
   (풍경 그림보다 가볍게 그려서 배터리에도 유리)
   ===================================================================== */
if (!DB.view) DB.view = 'scene';
const mapMode = () => true;   // 그림 풍경은 쓰지 않음: 길은 지도, 산·빌딩은 높이 그림
let mv = null;
function buildMapView(){
  const xs = P.map(p => p.x), ys = P.map(p => p.y), minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const x0 = W * 0.07, x1 = W * 0.93, y0 = AREA.top + 34 * DPR, y1 = AREA.bot - 34 * DPR;
  const sc = Math.min((x1 - x0) / ((maxX - minX) || 1), (y1 - y0) / ((maxY - minY) || 1));
  const ox = x0 + ((x1 - x0) - (maxX - minX) * sc) / 2, oy = y0 + ((y1 - y0) - (maxY - minY) * sc) / 2;
  const tf = p => [ox + (p.x - minX) * sc, oy + (maxY - p.y) * sc];
  const base = document.createElement('canvas'); base.width = W; base.height = H;
  const g = base.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#e9efe2'); bg.addColorStop(1, '#dfe7d6');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(0,0,0,.05)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 40 * DPR){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 40 * DPR){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.lineJoin = 'round'; g.lineCap = 'round';
  const line = (w, col) => { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); for (let d = 0; d <= L - 1; d += L / 400){ const q = tf(pointAt(d)); d ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); } g.stroke(); };
  line(14 * DPR, '#ffffff'); line(8 * DPR, '#9aa59a');
  const fs = Math.round(13 * DPR);
  LMS.forEach(lm => {
    const q = tf(pointAt(lm.at)), hub = isHub(lm);
    g.fillStyle = hub ? '#fff' : '#cfd6cc'; g.strokeStyle = hub ? '#7a5a2e' : '#8f998d'; g.lineWidth = 2 * DPR;
    g.beginPath(); g.arc(q[0], q[1], (hub ? 7 : 4) * DPR, 0, 7); g.fill(); g.stroke();
    if (hub){
      g.font = '800 ' + fs + 'px sans-serif'; const tw = g.measureText(tr(lm.name)).width;
      const lx = Math.min(W - tw - 8 * DPR, Math.max(8 * DPR, q[0] - tw / 2)), ly = q[1] - 14 * DPR;
      g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(lx - 5 * DPR, ly - fs, tw + 10 * DPR, fs + 8 * DPR);
      g.fillStyle = '#24332a'; g.fillText(tr(lm.name), lx, ly);
    }
  });
  const s0 = tf(pointAt(0)); g.fillStyle = '#16382a'; g.font = '800 ' + fs + 'px sans-serif'; g.fillText('▶ ' + tr(LMS[0] ? LMS[0].name : ''), s0[0] + 10 * DPR, s0[1] + 18 * DPR);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.font = Math.round(11 * DPR) + 'px sans-serif'; g.fillText(T.mapNote, 12 * DPR, AREA.bot - 8 * DPR);
  mv = { base, tf, w: W, h: H, top: AREA.top, bot: AREA.bot };
}
function drawMapView(pos){
  if (!mv || mv.w !== W || mv.h !== H || mv.top !== AREA.top || mv.bot !== AREA.bot) buildMapView();
  ctx.drawImage(mv.base, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#3f9a52'; ctx.lineWidth = 8 * DPR;
  ctx.beginPath(); for (let d = 0; d <= pos; d += Math.max(5, L / 400)){ const q = mv.tf(pointAt(d)); d ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
  const qe = mv.tf(pointAt(pos)); ctx.lineTo(qe[0], qe[1]); ctx.stroke();
  LMS.forEach(lm => { if (lm.at <= pos && isHub(lm)){ const q = mv.tf(pointAt(lm.at)); ctx.fillStyle = '#3f9a52'; ctx.beginPath(); ctx.arc(q[0], q[1], 7 * DPR, 0, 7); ctx.fill(); } });
  const pulse = 1 + 0.25 * Math.sin(performance.now() / 300);
  ctx.fillStyle = 'rgba(232,87,74,.25)'; ctx.beginPath(); ctx.arc(qe[0], qe[1], 16 * DPR * pulse, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(qe[0], qe[1]); ctx.rotate(headingAt(pos));
  ctx.fillStyle = '#e8574a'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5 * DPR; const a = 11 * DPR;
  ctx.beginPath(); ctx.moveTo(0, -a); ctx.lineTo(a * 0.75, a * 0.75); ctx.lineTo(0, a * 0.35); ctx.lineTo(-a * 0.75, a * 0.75); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
/* 정보칸: 다음 거점 사진 · 고도 그래프 · 오르막/내리막 */
const ipCv = $('ipElev'), ipCtx = ipCv.getContext('2d');
function updateInfoPanel(pos){
  const nh = nextSpotFrom(totalNow());
  $('ipPhoto').innerHTML = typeof nh.lm.photo === 'string' ? photoHtml(nh.lm.photo, 0, true) : '<span class="noph">🚩</span>'; $('ipPhoto').classList.toggle('empty', typeof nh.lm.photo !== 'string');
  ipViewFor(nh.lm);
  $('ipName').textContent = '🚩 ' + tr(nh.lm.name) + ' ' + (nh.d >= 1000 ? (nh.d / 1000).toFixed(1) + 'km' : Math.round(nh.d) + 'm');
  const w = ipCv.width = Math.round(ipCv.clientWidth * DPR || 200 * DPR), h = ipCv.height = Math.round(36 * DPR), g = ipCtx, rng = Math.max(30, ELEV_MAX - ELEV_MIN);
  const yy = e => h - 4 * DPR - (e - ELEV_MIN) / rng * (h - 10 * DPR);
  g.clearRect(0, 0, w, h); g.beginPath(); g.moveTo(0, h);
  for (let x = 0; x <= w; x += 2){ g.lineTo(x, yy(elevAt(x / w * (L - 1)))); }
  g.lineTo(w, h); g.closePath(); g.fillStyle = '#cfe0c9'; g.fill();
  g.beginPath(); g.moveTo(0, h); g.lineTo(0, yy(elevAt(0)));
  for (let x = 0; x <= pos / L * w; x += 2){ g.lineTo(x, yy(elevAt(x / w * (L - 1)))); }
  g.lineTo(pos / L * w, h); g.closePath(); g.fillStyle = '#7fd18a'; g.fill();
  g.fillStyle = '#e8574a'; g.beginPath(); g.arc(pos / L * w, yy(elevAt(pos)), 4 * DPR, 0, 7); g.fill();
  $('ipGrade').textContent = gradeText(pos) + ' · ' + T.alti + ' ' + Math.round(elevAt(pos)) + 'm';
  const wn = walkNote(pos); $('ipNote').textContent = wn[0]; $('ipNote').classList.toggle('ok', wn[1]);
  $('ipCourse').textContent = tr(COURSE.name) + ' · ' + (pos / 1000).toFixed(1) + ' / ' + (L / 1000).toFixed(L % 1000 ? 1 : 0) + 'km · ' +
    T.hubsOf.replace('{a}', HUBS.filter(h => h.at <= pos).length).replace('{b}', HUBS.length) + ' · ' + T.alti + ' ' + Math.round(ELEV_MIN) + (ELEV_MAX - ELEV_MIN > 1 ? '~' + Math.round(ELEV_MAX) : '') + 'm';
}
function walkNote(pos){   // [문구, 평온한 상태인지]
  const nh = nextSpotFrom(totalNow()), gr = gradeAt(pos); let note = '', ok = false;
  if (nh.d <= 300) note = '🚩 ' + T.nSoon.replace('{s}', tr(nh.lm.name));
  else if (gr > 6) note = T.nSteepUp;
  else if (gr < -6) note = T.nSteepDown;
  else if (gr > 2.5) note = T.nUp;
  else if (gr < -2.5) note = T.nDown;
  else { note = T.nFlat; ok = true; }
  if (S.act === 'tread' && gr > 2.5) note += ' · ' + T.nIncline.replace('{g}', Math.min(15, Math.round(gr)));
  return [note, ok];
}
function climbNote(st){
  const m = st.m, wp = (m.waypoints || []).find(x => { const d = wpAt(m, x) - st.climbed; return d > 0 && d <= 40; });
  if (st.remain <= 50) return [T.nTop.replace('{d}', Math.round(st.remain)), false];
  if (wp) return ['🥾 ' + T.nSoon.replace('{s}', tr(wp.name)), false];
  return [st.ratio > 0.5 ? T.nHalf : T.nKeep, true];

/* ---- 거점 사진 크게 보기 (11/15: 로드뷰·거리뷰 버튼 삭제 → 사진으로 대체)

/* =====================================================================

/* =====================================================================

function climbCurve(t){ return Math.min(1, Math.max(0, t + 0.035 * Math.sin(t * Math.PI * 6) * t * (1 - t) * 4)); }   // 산 모양 (조금 구불구불)
function drawClimbView(st){
  const m = st.m, tower = m.kind === 'tower';
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, tower ? '#dfe7ef' : '#dbe9f3'); bg.addColorStop(1, tower ? '#eef1f4' : '#e8efe0');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const top = AREA.top + 44 * DPR, bot = AREA.bot - 44 * DPR, fs = Math.round(14 * DPR);
  ctx.font = '800 ' + fs + 'px sans-serif';
  if (tower){
    const bw = W * 0.34, bx = W / 2 - bw / 2, hh = bot - top;
    ctx.fillStyle = '#c3cfdb'; ctx.fillRect(bx, top, bw, hh);
    const fh = hh * st.ratio;
    ctx.fillStyle = '#7fbf8c'; ctx.fillRect(bx, bot - fh, bw, fh);
    const stepF = m.floors > 80 ? 20 : 10;
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1 * DPR; ctx.fillStyle = '#556677';
    for (let f = stepF; f < m.floors; f += stepF){ const y = bot - hh * f / m.floors; ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx + bw, y); ctx.stroke(); ctx.fillText(f + 'F', bx + bw + 8 * DPR, y + fs * 0.35); }
    ctx.fillStyle = '#24332a'; ctx.textAlign = 'center'; ctx.fillText('🏙 ' + tr(m.name) + ' · ' + m.floors + 'F · ' + m.summit + 'm', W / 2, top - 12 * DPR); ctx.textAlign = 'left';
    const y = bot - fh; ctx.fillStyle = '#e8574a'; ctx.fillRect(bx - 10 * DPR, y - 2 * DPR, bw + 20 * DPR, 4 * DPR);
    ctx.font = '900 ' + Math.round(18 * DPR) + 'px sans-serif'; ctx.fillText(st.floor + 'F', bx - 62 * DPR, y + 6 * DPR);
    return;
  }
  const x0 = W * 0.08, x1 = W * 0.92, X = t => x0 + (x1 - x0) * t, Y = t => bot - (bot - top) * climbCurve(t);
  ctx.beginPath(); ctx.moveTo(x0, bot + 30 * DPR); for (let i = 0; i <= 100; i++) ctx.lineTo(X(i / 100), Y(i / 100)); ctx.lineTo(x1, bot + 30 * DPR); ctx.closePath();
  ctx.fillStyle = '#c9d9c3'; ctx.fill();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 12 * DPR; ctx.beginPath(); for (let i = 0; i <= 100; i++) ctx.lineTo(X(i / 100), Y(i / 100)); ctx.stroke();
  ctx.strokeStyle = '#9aa59a'; ctx.lineWidth = 7 * DPR; ctx.beginPath(); for (let i = 0; i <= 100; i++) ctx.lineTo(X(i / 100), Y(i / 100)); ctx.stroke();
  ctx.strokeStyle = '#3f9a52'; ctx.beginPath(); for (let i = 0; i <= Math.round(st.ratio * 100); i++) ctx.lineTo(X(i / 100), Y(i / 100)); ctx.lineTo(X(st.ratio), Y(st.ratio)); ctx.stroke();
  const flag = (t, label, hub) => { const x = X(t), y = Y(t);
    ctx.fillStyle = hub ? '#fff' : '#e3e8e1'; ctx.strokeStyle = '#7a5a2e'; ctx.lineWidth = 2 * DPR; ctx.beginPath(); ctx.arc(x, y, (hub ? 7 : 5) * DPR, 0, 7); ctx.fill(); ctx.stroke();
    ctx.font = (hub ? '800 ' : '600 ') + fs + 'px sans-serif'; const tw = ctx.measureText(label).width, lx = Math.max(8 * DPR, x - tw - 16 * DPR), ly = y - (hub ? fs + 14 * DPR : fs * 0.5 + 4 * DPR);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(lx - 5 * DPR, ly, tw + 10 * DPR, fs + 8 * DPR); ctx.fillStyle = '#24332a'; ctx.fillText(label, lx, ly + fs); };
  (m.waypoints || []).forEach(w => flag(wpAt(m, w) / m.gain, tr(w.name) + ' ' + w.elev + 'm', false));
  flag(1, '⛰ ' + tr(m.name) + ' ' + m.summit.toLocaleString() + 'm', true);
  ctx.fillStyle = '#24332a'; ctx.font = '700 ' + Math.round(12 * DPR) + 'px sans-serif'; ctx.fillText('▶ ' + tr(m.baseName || { ko: '' }) + ' ' + m.base + 'm', x0, bot + 22 * DPR);
  const px = X(st.ratio), py = Y(st.ratio), pulse = 1 + 0.25 * Math.sin(performance.now() / 300);
  ctx.fillStyle = 'rgba(232,87,74,.25)'; ctx.beginPath(); ctx.arc(px, py, 16 * DPR * pulse, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8574a'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3 * DPR; ctx.beginPath(); ctx.arc(px, py, 8 * DPR, 0, 7); ctx.fill(); ctx.stroke();
}

function drawFree(){   // 목표 링: 가운데 큰 숫자, 둘레가 차오름

/* =====================================================================
   하루 걸음: 앱을 켜 둔 동안 폰 센서로 늘 셈 (DB.steps[날짜] = { n 센 걸음, run 운동 중 걸음, used 코스에 반영한 걸음 })
   · 삼성 헬스 숫자로 맞추기 가능 · 코스 반영은 사용자가 버튼으로 결정
   ===================================================================== */
const STEP = { ok: false, avg: 9.8, f: 0, rising: false, last: 0 };
const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function stepDay(){ DB.steps = DB.steps || {}; const k = dayKey(); if (!DB.steps[k]){ DB.steps[k] = { n: 0, run: 0, used: 0 }; Object.keys(DB.steps).sort().slice(0, -40).forEach(x => delete DB.steps[x]); } return DB.steps[k]; }
/* 운동 기록에서 걸음 추정 (센서가 못 센 운동도 하루 합계에 들어가게)
   걷기·조깅·트레드밀 = 거리 ÷ 보폭 · 천국의 계단 = 오른 높이 ÷ 계단 20cm · 실제 등산 = 오른 높이 1m당 약 15보 · 자전거 = 0 */
function recSteps(r){
  if (r.src === 'steps') return 0;
  if (r.act === 'bike') return 0;
  if (r.act === 'stair') return Math.round((r.upM || 0) / STEP_M);
  if (r.act === 'hike') return Math.round((r.upM || 0) * 15);
  const kmh = r.sec > 60 ? (r.distM || 0) / r.sec * 3.6 : 6;
  return Math.round((r.distM || 0) / (kmh >= 8 ? (DB.stride.run || 1) : (DB.stride.walk || 0.72)));
}
function stepInfo(){   // { total 하루 합계, work 운동 걸음, other 운동 밖 걸음, free 코스에 반영할 수 있는 걸음 }
  const d = stepDay(), today = new Date().toDateString();
  const est = DB.records.filter(r => new Date(r.date).toDateString() === today).reduce((a, r) => a + recSteps(r), 0);
  const work = Math.max(d.run, est), other = Math.max(0, d.n - d.run);
  let total = other + work;
  if (d.set && d.set > total) total = d.set;          // 삼성 헬스 숫자가 더 크면 그 숫자
  if (d.native && d.native > total) total = d.native; // 앱(APK): 폰 걸음 칩 24시간 숫자
  const free = Math.max(0, total - work - d.used);

}
function stepFree(){ return stepInfo().free; }
let stepSaveT = 0;
function onBgMotion(e){
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  if (!STEP.ok){ STEP.ok = true; refreshSteps(); }
  const t = performance.now(), mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
  STEP.avg = STEP.avg * 0.98 + mag * 0.02; STEP.f = STEP.f * 0.6 + (mag - STEP.avg) * 0.4;
  if (!STEP.rising && STEP.f > 1.2 && t - STEP.last > 260){
    STEP.rising = true; STEP.last = t;
    const d = stepDay(); d.n++; if (S.running && !S.paused) d.run++;   // 운동 중 걸음은 이미 운동 기록에 들어감

    if (d.n % 5 === 0) refreshSteps();

}
function stepsListen(){ try { window.removeEventListener('devicemotion', onBgMotion); window.addEventListener('devicemotion', onBgMotion); } catch(e){} }
async function stepsPermission(){   // 아이폰은 한 번 눌러서 허용해야 함

}
var NSTEP = { ok: false, perm: false };   // 앱(APK) 걸음 칩 상태

/* 앱(APK): 폰 걸음 칩에서 오늘 걸음(24시간)을 가져옴 — 처음엔 '신체 활동' 권한을 물음 */
function nativeSteps(first){
  const P = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Steps;
  if (!P) return;

    NSTEP.ok = true; NSTEP.perm = false;

    Object.entries(r.history || {}).forEach(([k, v]) => { DB.steps = DB.steps || {}; const t = DB.steps[k] || (DB.steps[k] = { n: 0, run: 0, used: 0 }); t.native = Math.max(t.native || 0, v); });

nativeSteps(true);
setInterval(() => { if (!document.hidden) nativeSteps(false); }, 60000);
