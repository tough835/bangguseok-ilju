/* =====================================================================
   바깥 운동 GPS 기록: 움직인 거리만큼 고른 코스에서 앞으로
   · 정확도 35m 넘는 신호, 순간이동(걷기 초속 12m·자전거 25m 초과)은 버림
   · 화면이 꺼지면 웹페이지는 위치를 못 받음 → 화면 켜 둔 채로 (앱으로 만들면 해결)
   ===================================================================== */
var GPS = { id: null, last: null, spd: 0 };
function gpsUsable(){ return !!BG || (typeof geoUsable === 'function' && geoUsable()); }
function gpsDist(a, b){ const r = Math.PI / 180, x = (b.lon - a.lon) * r * Math.cos((a.lat + b.lat) / 2 * r), y = (b.lat - a.lat) * r; return Math.hypot(x, y) * 6371000; }
/* 설치형 앱(APK) 안에서 열리면: 폰 기능(잠금 중 GPS)을 직접 씀 */
var CAP = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ? window.Capacitor : null;
var BG = CAP && CAP.Plugins && CAP.Plugins.BackgroundGeolocation;
function gpsFix(lat, lon, acc, t){   // 위치 한 번 받을 때마다 (웹·앱 공통)
  acc = Math.round(acc || 99); const now = { lat, lon, t: t || Date.now() };
  $('gpsPill').textContent = (acc <= 20 ? T.gpsOk : T.gpsWeak).replace('{a}', acc);
  if (acc > 35 || !S.running) return;
  if (!GPS.last){ GPS.last = now; return; }
  const d = gpsDist(GPS.last, now), dt = Math.max(0.5, (now.t - GPS.last.t) / 1000), v = d / dt;
  if (v > (S.act === 'bike' ? 25 : 12)){ GPS.last = now; return; }   // 튀는 값
  if (d < Math.max(4, acc * 0.4)) return;                              // 제자리 흔들림
  GPS.last = now; if (!S.paused) trackPush(lat, lon);
  GPS.lastMove = Date.now();
  if (!S.paused){
    advance(d); GPS.spd = GPS.spd ? GPS.spd * 0.6 + v * 3.6 * 0.4 : v * 3.6; S.speed = Math.round(GPS.spd * 10) / 10; refreshSpeedBox(false);
    if (Date.now() - (GPS.saved || 0) > 30000){ GPS.saved = Date.now(); autosave(false); }   // 잠금 중에도 30초마다 저장
  }
}
function gpsStart(){
  GPS.last = null; GPS.spd = 0;
  if (BG){   // 앱: 알림창에 '기록 중'을 띄우고 잠금 중에도 계속 받음
    BG.addWatcher({ backgroundTitle: T.bgTitle, backgroundMessage: T.bgMsg, requestPermissions: true, stale: false, distanceFilter: 3 }, (loc, err) => {
      if (err){
        if (err.code === 'NOT_AUTHORIZED'){ toastMsg(T.gpsPerm); $('gpsPill').textContent = T.gpsLost; try { BG.openSettings(); } catch(e){} }
        return;
      }
      if (loc) gpsFix(loc.latitude, loc.longitude, loc.accuracy, loc.time);
    }).then(id => { GPS.id = id; }).catch(() => toastMsg(T.gpsLost));
    return;
  }
  try {
    GPS.id = navigator.geolocation.watchPosition(p => gpsFix(p.coords.latitude, p.coords.longitude, p.coords.accuracy, p.timestamp), e => {
      GPS.err = e && e.code;
      if (e && e.code === 1){ toastMsg(T.gpsLost); gpsStop(); $('gpsPill').textContent = T.gpsLost; SITE.blocked = true; }   // 위치 권한 거부
      else $('gpsPill').textContent = T.gpsWait;                                                                            // 잠깐 신호 없음 → 계속 기다림
    }, { enableHighAccuracy: true, maximumAge: 0 });
  } catch(e){ toastMsg(T.gpsLost); }
}
function gpsStop(){ try { if (GPS.id != null){ if (BG) BG.removeWatcher({ id: GPS.id }); else navigator.geolocation.clearWatch(GPS.id); } } catch(e){} GPS.id = null; }

/* =====================================================================

  if (to >= 1){ g.lineTo(X(1) + 40 * DPR, Y(1) + 6 * DPR); g.lineTo(cw + 10, Y(1) + Math.max(0, cw - X(1)) * 0.7); }
  g.lineTo(cw + 10, chh + 10); g.closePath(); g.fillStyle = '#c9d9c3'; g.fill();
  if (!mini){   // 높이 눈금 (10m마다, 50m마다 진하게)
    g.font = '700 ' + Math.round(11 * DPR) + 'px sans-serif'; g.textAlign = 'right';
    for (let e = Math.ceil((st.elev - range) / 10) * 10; e <= st.elev + range; e += 10){ const yy = cy - (e - st.elev) * ppm; if (yy < 0 || yy > vh) continue; const major = e % 50 === 0;
      g.strokeStyle = major ? 'rgba(36,51,42,.22)' : 'rgba(36,51,42,.08)'; g.lineWidth = 1 * DPR; g.beginPath(); g.moveTo(0, yy); g.lineTo(cw, yy); g.stroke();
      g.fillStyle = major ? 'rgba(36,51,42,.75)' : 'rgba(36,51,42,.4)'; g.fillText(e.toLocaleString() + 'm', cw - 8 * DPR, yy - 3 * DPR); }
    g.textAlign = 'left';
  }
  if (!mini){   // 길가 나무 (1,500m 위는 키 작은 나무·바위)
    for (let e = Math.ceil((st.elev - range) / 5) * 5; e <= st.elev + range; e += 5){
      const s = (e - m.base) / m.gain, r = rnd(e + 3); if (s < 0 || s > 1 || r < 0.3) continue;
      const hi = e > 1500, px = X(s) + (16 + r * 70) * DPR, py = Y(s) + (16 + r * 70) * DPR * 0.8 + 6 * DPR, th = (hi ? 9 : 20) * DPR * (0.7 + r * 0.6);
      if (py < 0 || py > vh) continue;
      if (hi && r > 0.7){ g.fillStyle = 'rgba(128,128,120,.5)'; g.beginPath(); g.arc(px, py, th * 0.45, 0, 7); g.fill(); continue; }
      g.fillStyle = hi ? 'rgba(86,128,82,.5)' : 'rgba(47,107,52,.5)'; g.beginPath(); g.moveTo(px, py - th); g.lineTo(px + th * 0.42, py); g.lineTo(px - th * 0.42, py); g.closePath(); g.fill();
    }
  }
  const stroke = (arr, col, w) => { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); arr.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); };
  g.lineJoin = 'round'; g.lineCap = 'round';
  const wd = (mini ? 5 : 9) * DPR; stroke(pts, '#fff', wd + 5 * DPR); stroke(pts, '#9aa59a', wd);
  const done = pts.filter(p => p[1] >= cy); done.push([cx, cy]); stroke(done, '#3f9a52', wd);
  const flag = (s, label, hub) => { const px = X(s), py = Y(s);
    g.fillStyle = s <= s0 ? '#3f9a52' : hub ? '#fff' : '#e3e8e1'; g.strokeStyle = '#7a5a2e'; g.lineWidth = 2 * DPR; g.beginPath(); g.arc(px, py, (hub ? 8 : 6) * DPR * (mini ? 0.6 : 1), 0, 7); g.fill(); g.stroke();
    if (mini || py < 0 || py > vh) return;
    const fs = (hub ? 14 : 13) * DPR; g.font = (hub ? '800 ' : '700 ') + Math.round(fs) + 'px sans-serif';
    const tw = g.measureText(label).width, bh = fs + 9 * DPR, lx = Math.max(6 * DPR, px - tw - 16 * DPR), ly = py - bh - 6 * DPR;
    g.fillStyle = 'rgba(255,255,255,.92)'; g.fillRect(lx - 5 * DPR, ly, tw + 10 * DPR, bh); g.fillStyle = '#24332a'; g.fillText(label, lx, ly + fs + 2 * DPR); };
  (m.waypoints || []).forEach(w => { const s = wpAt(m, w) / m.gain; if (s >= from && s <= to) flag(s, tr(w.name) + ' ' + w.elev.toLocaleString() + 'm', false); });
  if (to >= 1) flag(1, '⛰ ' + tr(m.name) + ' ' + m.summit.toLocaleString() + 'm', true);
  if (from <= 0 && !mini){ g.fillStyle = '#24332a'; g.font = '700 ' + Math.round(12 * DPR) + 'px sans-serif'; g.fillText('▶ ' + tr(m.baseName || { ko: '' }) + ' ' + m.base + 'm', Math.max(8 * DPR, X(0) - 40 * DPR), Y(0) + 22 * DPR); }
  if (!mini) fadeBottom(g, vh);
  dot(cx, cy);
}
function drawClimbMini(st){   // 작은 칸: 산·빌딩 전체에서 어디쯤인지
  const g = mctx, sz = mapCv.width, m = st.m, top = 28 * DPR, bot = sz - 30 * DPR;
  g.clearRect(0, 0, sz, sz);
  if (m.kind === 'tower'){
    const bw = sz * 0.3, bx = (sz - bw) / 2, hh = bot - top, fh = hh * st.ratio;
    g.fillStyle = '#c3cfdb'; g.fillRect(bx, top, bw, hh); g.fillStyle = '#7fbf8c'; g.fillRect(bx, bot - fh, bw, fh);
    g.fillStyle = '#e8574a'; g.fillRect(bx - 8 * DPR, bot - fh - 2 * DPR, bw + 16 * DPR, 4 * DPR);
    miniTag(T.tagAll, st.floor + ' / ' + m.floors + 'F'); return;
  }
  const x0 = 12 * DPR, x1 = sz - 12 * DPR, X = t => x0 + (x1 - x0) * t, Y = t => bot - (bot - top) * climbCurve(t);
  g.beginPath(); g.moveTo(x0, bot + 6 * DPR); for (let i = 0; i <= 40; i++) g.lineTo(X(i / 40), Y(i / 40)); g.lineTo(x1, bot + 6 * DPR); g.closePath(); g.fillStyle = '#c9d9c3'; g.fill();
  g.lineJoin = 'round'; g.lineCap = 'round'; g.lineWidth = 4 * DPR;
  g.strokeStyle = '#9aa59a'; g.beginPath(); for (let i = 0; i <= 40; i++) g.lineTo(X(i / 40), Y(i / 40)); g.stroke();
  g.strokeStyle = '#3f9a52'; g.beginPath(); for (let i = 0; i <= Math.floor(st.ratio * 40); i++) g.lineTo(X(i / 40), Y(i / 40)); g.lineTo(X(st.ratio), Y(st.ratio)); g.stroke();
  g.fillStyle = '#e8574a'; g.strokeStyle = '#fff'; g.lineWidth = 2 * DPR; g.beginPath(); g.arc(X(st.ratio), Y(st.ratio), 5 * DPR, 0, 7); g.fill(); g.stroke();
  miniTag(T.tagAll, Math.floor(st.ratio * 100) + '% · ' + Math.round(st.elev).toLocaleString() + 'm');
}

/* =====================================================================
   현장 인증: 실제로 그 지역(함양군)·그 빌딩에 와 있을 때 폰 위치를 한 번 확인
   → 그날 그 코스 기록에 📍 현장 표시, 지나온 길의 거점이 금색
   (위치를 읽을 수 없는 화면에서는 버튼이 보이지 않음)
   ===================================================================== */
var GEO = { hamyang: { lat: 35.52, lon: 127.725, r: 28000 }, seoul: { lat: 37.5665, lon: 126.978, r: 22000 }, busan: { lat: 35.16, lon: 129.07, r: 25000 }, jeju: { lat: 33.38, lon: 126.55, r: 45000 }, lotte: { lat: 37.5125, lon: 127.1025, r: 1500 }, b63: { lat: 37.5198, lon: 126.9403, r: 1500 },
            lct: { lat: 35.1607, lon: 129.1688, r: 1500 }, esb: { lat: 40.7484, lon: -73.9857, r: 1500 }, burj: { lat: 25.1972, lon: 55.2744, r: 1500 } };
var SITE = { blocked: false, busy: false };
function sitePlace(){
  if (DB.pick.type === 'climb'){ const m = TGT(DB.climb.sel); return m.kind === 'tower' ? { key: m.id, name: tr(m.short || m.name) } : { key: m.cityId, name: tr(m.cityName) }; }
  return { key: CITY.id, name: tr(CITY.name) };
}
function recPlace(r){ const c = r.credit || {}; if (c.course === 'climb'){ const m = TGT(c.target); return m.kind === 'tower' ? m.id : m.cityId; } const rd = ALL_ROADS[c.target]; return rd ? rd.cityId : CITY.id; }
function siteOK(key){ return !!(DB.site && DB.site.key === key && DB.site.day === new Date().toDateString()); }
function geoUsable(){
  if (!SITE || SITE.blocked || !('geolocation' in navigator)) return false;
  try { const fp = document.featurePolicy || document.permissionsPolicy; if (fp && fp.allowsFeature && !fp.allowsFeature('geolocation')) return false; } catch(e){}
  return true;
}
function refreshSite(){
  if (!GEO) return;
  const pl = sitePlace(), b = $('bSite'), ok = siteOK(pl.key);
  b.classList.toggle('hidden', DB.zone !== 'out' || (!ok && !(GEO[pl.key] && geoUsable())));
  b.textContent = ok ? T.siteOk.replace('{s}', pl.name) : SITE.busy ? T.siteWait : T.siteBtn.replace('{s}', pl.name);
}
$('bSite').onclick = () => {
  const pl = sitePlace(), geo = GEO[pl.key]; if (!geo || SITE.busy || siteOK(pl.key)) return;
  SITE.busy = true; refreshSite();
  navigator.geolocation.getCurrentPosition(p => {
    SITE.busy = false;
    const a1 = p.coords.latitude * Math.PI / 180, a2 = geo.lat * Math.PI / 180, dl = (geo.lon - p.coords.longitude) * Math.PI / 180;
    const dist = Math.acos(Math.min(1, Math.sin(a1) * Math.sin(a2) + Math.cos(a1) * Math.cos(a2) * Math.cos(dl))) * 6371000;
    if (dist <= geo.r){
      DB.site = { key: pl.key, day: new Date().toDateString() };
      DB.records.forEach(r => { if (new Date(r.date).toDateString() === DB.site.day && recPlace(r) === pl.key) r.site = true; });
      saveDB(); toastMsg(T.siteYes);
    } else toastMsg(T.siteFar.replace('{s}', pl.name).replace('{d}', (dist / 1000).toFixed(dist < 10000 ? 1 : 0)));
    refreshSite();
  }, () => { SITE.busy = false; SITE.blocked = true; toastMsg(T.siteNo); refreshSite(); }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
};
/* 화면 글자 채우기 (data-t → TEXT) 후 시작 */
document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = T[el.dataset.t] ?? el.innerHTML; });
document.title = T.appName;
applyPick();
/* 처음 열면 첫 화면(방구석 | 바깥). 코스를 바꿔서 화면을 새로 불러온 경우엔 바로 시작 화면 */
let fromReload = false; try { fromReload = sessionStorage.getItem('bgsj_inapp') === '1'; } catch(e){}
if (fromReload && DB.zone){ $('startScreen').classList.remove('hidden'); askResume(); } else showHome();
</script>
